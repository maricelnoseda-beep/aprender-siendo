<!doctype html>
<!-- «Chef en Acción: ¡Hoy cocinamos!» (nombre de trabajo): ocho rincones de la cocina con dos variantes cada uno (Zona y Espacio), según la
     FEC-016 v0.3 de PSP-SR (2026-11-21) y las decisiones D1 a D3 de la supervisora. Construida por DEV-IA como herramienta del portal (ADR-009,
     RT-CHF-001 v1.0). Corre aislada (iframe sin acceso a la app ni a sus datos) y también como archivo suelto para probar con doble clic.
     CONTENIDO DE PRUEBA NO VALIDADO: recetas, consignas, devoluciones y parámetros son borrador de DEV-IA, pendientes de PSP-SR.
     Dibujos de relleno hechos en código, sin IA generativa y sin imágenes de terceros (REQ-CLI-CHF-00a). Ningún modelo de lenguaje
     interviene: todo se corrige con el banco, en código (T11). En la cocina de juego, fuego, filo y electrodomésticos los usa el chef. -->
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chef en Acción</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>__BRAND_FONT__
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--as-papel,#fcfaf7);color:var(--as-tinta,#102f54);font-family:var(--as-fuente,"Nunito",system-ui,sans-serif);
  font-size:18px;line-height:1.45;padding:12px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--as-foco,#b95325);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{color:var(--as-tinta,#102f54);line-height:1.2;margin:0}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:1.15rem;font-weight:800}
h3{font-size:1.02rem;font-weight:800;margin:16px 0 6px}
p{margin:.4em 0}
.small{font-size:.95rem;color:var(--as-secundario,#526776)}
/* Letra MAYÚSCULA o minúscula imprenta (pedido de la supervisora): se aplica a todo lo que ve quien juega. */
body.mayus .nino,body.mayus .nino button,body.mayus .nino .letra{text-transform:uppercase}
body.mayus .nino .letra-ficha,body.mayus .nino .palabra,body.mayus .nino .letra-fija{text-transform:none}
#h-toda svg{width:28px;height:28px}
body.mayus .nino .adulto-txt{text-transform:none}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.marca{width:44px;height:44px;border-radius:12px;background:var(--as-marca) center/contain no-repeat;flex:none}
.hd .nm{font-weight:800;font-size:1.2rem;margin-right:auto}
.rotulo{display:inline-block;font-size:.85rem;font-weight:700;color:var(--as-aviso,#805024);background:var(--as-arena,#fff1d7);border-radius:999px;padding:4px 12px}
.letras{display:inline-flex;border:2px solid var(--as-tinta,#102f54);border-radius:999px;overflow:hidden}
.letras button{min-height:44px;min-width:56px;border:0;background:var(--as-superficie,#fff);font-weight:800;padding:4px 12px;text-transform:none!important}
.letras button[aria-pressed="true"]{background:var(--as-tinta,#102f54);color:#fff}
.panel{background:var(--as-superficie,#fff);border:1px solid var(--as-borde,#dae3e1);border-radius:var(--as-radio,22px);box-shadow:var(--as-sombra,0 2px 10px rgb(16 47 84 / 6%));padding:18px}
.btn{min-height:48px;border-radius:999px;border:2px solid var(--as-tinta,#102f54);background:var(--as-tinta,#102f54);color:var(--as-superficie,#fff);
  font-weight:800;font-size:1.05rem;padding:8px 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--as-superficie,#fff);color:var(--as-tinta,#102f54)}
.btn.suave{background:var(--as-menta,#e0f2eb);color:var(--as-tinta,#102f54);border-color:var(--as-borde-verde,#75b8a8)}
.btn.icono{min-width:48px;padding:8px 12px}
.btn.chico{min-height:44px;font-size:.95rem;padding:6px 16px}
.btn.ofrecida,.opcion.ofrecida{box-shadow:0 0 0 4px var(--as-sol,#ffb82e)}
.btn[disabled]{opacity:.55;cursor:default}
.parlante{min-width:48px;min-height:48px;border-radius:999px;border:2px solid var(--as-tinta,#102f54);background:var(--as-superficie,#fff);display:inline-grid;place-items:center;flex:none;padding:0}
.parlante svg{width:26px;height:26px}
.acciones{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.opciones{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--min,200px)),1fr))}
.opcion{border:2px solid var(--as-borde-verde,#75b8a8);border-radius:var(--as-radio-control,14px);background:var(--as-superficie,#fff);
  text-align:left;padding:10px 14px;min-height:52px;display:flex;flex-direction:column;gap:2px}
.opcion:hover{background:var(--as-suave,#f4f6f4)}
.opcion[aria-pressed="true"]{background:var(--as-menta,#e0f2eb);border-color:var(--as-verde,#196b6a);box-shadow:inset 0 0 0 2px var(--as-verde,#196b6a)}
.opcion[disabled]{opacity:.45;cursor:default}
.opcion .t{font-weight:800}
.opcion .d{font-size:.9rem;color:var(--as-texto,#354e60)}
.grupo{margin:14px 0}
.grupo>h2{margin-bottom:8px}
.casillas label{display:flex;align-items:center;gap:8px;min-height:44px}
.casillas input{width:22px;height:22px}
.consigna{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.consigna p{flex:1 1 200px;margin:0;font-weight:800;font-size:1.25rem}
.juego{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.juego{grid-template-columns:minmax(0,1fr) 260px;align-items:start}}
.lado{display:flex;flex-direction:column;gap:12px}
.msj-caja{display:flex;gap:8px;align-items:flex-start}
.msj{flex:1;min-height:3.2em;font-weight:700;padding:10px 12px;border-radius:var(--as-radio-control,14px);background:var(--as-suave,#f4f6f4)}
.msj:empty{background:transparent}
.msj-caja .parlante[hidden]{display:none}
.lamina{max-width:640px;margin:12px auto;border-radius:var(--as-radio-control,14px);overflow:hidden;border:1px solid var(--as-borde,#dae3e1);background:#fff}
.lamina svg{display:block;width:100%;height:auto}
.lamina.chica{max-width:380px}
.guia,.aviso{background:var(--as-arena,#fff1d7);border-radius:var(--as-radio-control,14px);padding:10px 14px;font-weight:700}
.escena-marco{position:relative;border-radius:var(--as-radio-control,14px);overflow:auto;border:1px solid var(--as-borde,#dae3e1);background:#fff;max-height:72vh}
.escena-marco svg.escena{display:block;width:calc(100% * var(--zoom,1));height:auto;user-select:none;-webkit-user-select:none}
svg [data-el]{cursor:pointer}
svg [data-el]:focus{outline:none}
svg [data-el]:focus-visible .foco{stroke:#b95325;stroke-width:6}
.foco{fill:transparent;stroke:transparent}
.hallado .foco{stroke:var(--as-verde,#196b6a);stroke-width:6;stroke-dasharray:10 6}
.zoom{display:flex;gap:8px;margin-top:8px}
/* Objetos sueltos (bandejas, cajas, sombras, casilleros) */
.ficha{border:3px solid var(--as-borde,#dae3e1);border-radius:var(--as-radio-control,14px);background:#fff;padding:4px;width:clamp(72px,16vw,108px);height:clamp(72px,16vw,108px);display:grid;place-items:center;touch-action:none}
.ficha svg{width:100%;height:100%}
/* IDV-CEX-001: ficha redonda en la niebla, las pistas de 8A y el cofre. Con :where() no tapa los estados elegida y puesta. */
.ficha:where(.redonda,[data-variante="cofre_cuales"] #cuerpo *,[data-variante="cofre_orden"] #cuerpo *,[data-variante="pistas_relampago"] #cuerpo *){border-radius:50%;border:3px dashed #8CC9A8;background:#fff;padding:10%}
.ficha[aria-pressed="true"]{border-color:var(--as-coral,#f58060);box-shadow:0 0 0 3px var(--as-coral,#f58060)}
.ficha.marcada,.destino.marcada{box-shadow:0 0 0 5px var(--as-sol,#ffb82e)}
.ficha.puesta{border-color:var(--as-verde,#196b6a);background:var(--as-menta,#e0f2eb);cursor:default}
.ficha.letra-ficha{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:800;line-height:1}
.bandeja{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;min-height:80px}
.cajas{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.destino{border:3px dashed var(--as-borde-verde,#75b8a8);border-radius:var(--as-radio,22px);background:var(--as-superficie,#fff);min-height:150px;padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left}
.destino .tit{display:flex;align-items:center;gap:10px;font-weight:800}
.destino .tit svg{width:56px;height:56px;flex:none}
.destino .dentro{display:flex;flex-wrap:wrap;gap:6px}
.destino .dentro .ficha{width:64px;height:64px}
.opcion .redonda{display:grid;place-items:center;width:clamp(76px,18vw,112px);height:clamp(76px,18vw,112px);border-radius:50%;border:3px dashed #8CC9A8;background:#fff;padding:10%;margin:0 auto}
.opcion .redonda svg{width:100%;height:100%}
/* IDV-CEX-001: mapa de la aventura para la persona adulta, por Estación (D5) */
.est-lista{display:grid;gap:0;border:1px solid var(--as-borde,#dae3e1);border-radius:var(--as-radio,22px);background:#fff;padding:4px 16px}
.est-fila{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--as-borde,#dae3e1)}
.est-fila:last-child{border-bottom:0}
.est-mini{flex:0 0 auto;width:72px;height:72px;border-radius:16px;border:3px solid;display:grid;place-items:center}
.est-mini svg{width:78%;height:78%}
.est-fila h3{margin:0;font-size:1rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.est-chip{font-size:.75rem;font-weight:800;border-radius:999px;padding:1px 8px;color:#102F54}
.est-fila p{margin:2px 0 0}
.modelo{display:flex;align-items:center;gap:12px;background:var(--as-menta,#e0f2eb);border-radius:var(--as-radio-control,14px);padding:8px 12px;font-weight:800}
.modelo .ficha{cursor:default}
.modelo.oculto .ficha{visibility:hidden}
.sombras{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:12px}
.sombra{width:clamp(96px,22vw,150px);height:clamp(96px,22vw,150px);border-radius:50%;border:3px solid var(--as-borde,#dae3e1);background:radial-gradient(ellipse at 50% 70%,#e7ece6 0 60%,#f4f6f4 61%);display:grid;place-items:center;padding:12px}
.sombra svg{width:100%;height:100%}
.sombra.descartada{opacity:.35}
.objeto-grande{width:clamp(140px,36vw,220px);height:clamp(140px,36vw,220px);margin:0 auto;display:grid;place-items:center}
.objeto-grande svg{width:100%;height:100%;overflow:visible}
.niebla-marco{max-width:360px;margin:0 auto;border-radius:var(--as-radio,22px);overflow:hidden;border:2px solid var(--as-borde,#dae3e1);background:#fff}
.niebla-marco svg{display:block;width:100%;height:auto}
.opciones-dib{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin-top:12px}
.opciones-dib .opcion{align-items:center;text-align:center}
.opciones-dib .opcion svg{width:84px;height:84px}
.palabra{font-size:clamp(2rem,8vw,3.4rem);font-weight:800;letter-spacing:.04em}
/* Laberinto y tableros */
.grilla{display:grid;gap:3px;max-width:520px;margin:0 auto;touch-action:manipulation}
/* IDV-CEX-001: casillas arena, flechas en tinta, salida verde con su nombre y destino en verde claro */
.celda{aspect-ratio:1;background:#FFF1D7;border:2px solid #F3DDB3;border-radius:8px;display:grid;place-items:center;position:relative}
.celda.pared{background:#DCEFD9;border-color:#C4E0BF}
.celda.salida{background:#196B6A;border-color:#196B6A}
.celda.salida .salida-txt{position:absolute;top:3px;left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:clamp(.7rem,1.8vw,.95rem);letter-spacing:.02em;pointer-events:none}
.celda.destino-lab{background:#E0F2EB;border-color:#8CC9A8}
.celda svg{width:92%;height:92%}
.celda.paso{box-shadow:inset 0 0 0 4px var(--as-sol,#ffb82e)}
.celda.flecha::after{content:attr(data-flecha);position:absolute;font-weight:800;color:var(--as-tinta,#102f54);font-size:1.4rem}
.flechas{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:6px;justify-content:center;margin-top:12px}
.flechas .btn{min-width:64px;min-height:64px;padding:0;font-size:1.6rem}
.flechas .arr{grid-column:2}
.flechas.persp{grid-template-columns:repeat(3,auto)}
.flechas.persp .btn{padding:0 12px;font-size:1rem}
.cartel{width:min(280px,70vw);margin:0 auto}
.cartel svg{width:100%;height:auto}
.trazo-marco{position:relative;max-width:760px;margin:0 auto;border-radius:var(--as-radio-control,14px);overflow:hidden;border:2px solid var(--as-borde,#dae3e1);background:#fff;touch-action:none}
.trazo-marco svg{display:block;width:100%;height:auto}
.trazo-marco canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.modelo-lado{max-width:220px;border:2px solid var(--as-borde-verde,#75b8a8);border-radius:var(--as-radio-control,14px);background:#fff;padding:6px}
.modelo-lado svg{width:100%;height:auto;display:block}
.tablero-fila{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:center}
/* Cofre y secuencias */
.fila-obj{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.fila-obj .ficha{cursor:default}
.casilleros{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.casillero{width:clamp(76px,16vw,112px);height:clamp(96px,19vw,136px);border:3px dashed var(--as-borde-verde,#75b8a8);border-radius:var(--as-radio-control,14px);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px;gap:2px}
.casillero .num{font-weight:800;background:var(--as-tinta,#102f54);color:#fff;border-radius:999px;width:28px;height:28px;display:grid;place-items:center;font-size:.9rem;flex:none}
.casillero .ficha{width:100%;height:auto;aspect-ratio:1;border:0;padding:0}
.casillero.lleno{border-style:solid}
.sonda{display:flex;flex-direction:column;align-items:center;gap:12px}
.sonda .ficha{width:150px;height:150px;cursor:default}
.dos-botones{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.dos-botones .btn{min-width:150px;min-height:64px;font-size:1.2rem}
.hojas-caen{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:3/2;background:#eef3e9;border-radius:var(--as-radio,22px)}
.hojas-caen button{position:absolute;width:64px;height:64px;border:0;background:transparent;padding:0}
.hojas-caen button svg{width:100%;height:100%}
.hojas-caen button[disabled]{opacity:.25}
/* Carrera de pistas */
.collar{display:flex;align-items:center;gap:12px;justify-content:center;background:var(--as-menta,#e0f2eb);border-radius:var(--as-radio,22px);padding:8px 14px;font-weight:800}
.collar .ficha{cursor:default;width:84px;height:84px}
.sendero{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0;min-height:160px;align-items:center;background:linear-gradient(#f4f6f4,#eef3e9);border-radius:var(--as-radio,22px);padding:10px}
.sendero .ficha{width:clamp(96px,24vw,140px);height:clamp(96px,24vw,140px)}
.sendero .tapada{background:#dfe9d8}
/* Mapa y piezas */
.mapa{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.lugar{border:2px solid var(--as-borde-verde,#75b8a8);border-radius:var(--as-radio,22px);background:#fff;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:180px}
.lugar svg{width:100%;max-width:200px;height:auto;aspect-ratio:3/2;border-radius:14px}
.lugar .t{font-weight:800}
.lugar .pieza{font-size:.9rem;font-weight:800;color:var(--as-verde,#196b6a)}
.lugar[disabled]{opacity:.45}
.piezas{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.piezas svg{width:56px;height:56px}
.cierre{text-align:center}
.cierre .acciones{justify-content:center}
.idea,.contar{margin:16px auto;max-width:760px;text-align:left;background:var(--as-suave,#f4f6f4);border-radius:var(--as-radio,22px);padding:14px 16px}
.idea p{font-weight:700}
.pregunta{display:flex;align-items:center;gap:8px;font-weight:800;margin-top:12px}
.dialogo{position:fixed;inset:0;background:rgb(16 47 84 / 45%);display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}
.dialogo .panel{max-width:980px;width:100%}
table.reg{border-collapse:collapse;width:100%;font-size:.9rem}
table.reg th,table.reg td{border-bottom:1px solid var(--as-borde,#dae3e1);padding:6px;text-align:left;vertical-align:top}
.tabla-scroll{overflow-x:auto}
.leyenda{font-size:.92rem;padding:8px 12px;border-left:4px solid var(--as-borde-verde,#75b8a8);background:var(--as-suave,#f4f6f4);margin:8px 0}
.fantasma{position:fixed;pointer-events:none;width:84px;height:84px;transform:translate(-50%,-50%);opacity:.9;z-index:20;border:3px solid var(--as-coral,#f58060);border-radius:14px;background:#fff;display:grid;place-items:center}
.fantasma svg{width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.girando{transition:transform 1.6s ease-in-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- Propios de «Chef en Acción» ---------- */
.rincones{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.rincon{border:2px solid var(--as-borde-verde,#75b8a8);border-radius:var(--as-radio,22px);background:#fff;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:170px}
.rincon svg{width:100%;max-width:180px;height:auto;aspect-ratio:3/2}
.rincon .t{font-weight:800}
.rincon .tarjeta-ok{font-size:.9rem;font-weight:800;color:var(--as-verde,#196b6a)}
.receta{border:2px solid var(--as-borde,#dae3e1);border-radius:var(--as-radio-control,14px);background:#fff;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;text-align:center}
.receta svg{width:84px;height:84px}
.receta .t{font-weight:800}
.receta .ings{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.receta .ings svg{width:30px;height:30px}
.receta .datos{font-size:.85rem;color:var(--as-texto,#354e60)}
.opcion.receta{align-items:center;text-align:center}
.opcion .dib svg,.opcion svg.dib{width:72px;height:72px}
.ficha .nom,.ing-nom{font-size:.72rem;font-weight:800;line-height:1.1;text-align:center}
.ficha.con-nombre{display:flex;flex-direction:column;justify-content:center;gap:2px;height:auto;min-height:clamp(84px,18vw,118px)}
.ficha.con-nombre svg{width:70%;height:auto;aspect-ratio:1}
.ficha.resaltada,.opcion.resaltada{box-shadow:0 0 0 5px var(--as-sol,#ffb82e)}
.lista-receta{background:var(--as-arena,#fff1d7);border-radius:var(--as-radio-control,14px);padding:8px 12px}
.lista-receta ul{margin:4px 0 0;padding-left:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.lista-receta li{display:flex;align-items:center;gap:4px;font-weight:800}
.lista-receta li svg{width:36px;height:36px}
.lista-receta.tapada ul{visibility:hidden}
.mesada{background:#F3EBDD;border:2px solid #D9C8A8;border-radius:var(--as-radio,22px);padding:10px;min-height:96px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mesada .ficha{width:72px;height:72px;cursor:default}
.estante{background:linear-gradient(#fff 0 86%,#E9D8BE 86%);border:2px solid #D9C8A8;border-radius:var(--as-radio,22px);padding:10px;display:flex;flex-wrap:wrap;gap:8px}
.contador{font-size:2rem;font-weight:800;min-width:2.5ch;text-align:center}
.carrito{display:flex;flex-wrap:wrap;gap:4px;min-height:84px;border:3px dashed var(--as-borde-verde,#75b8a8);border-radius:var(--as-radio,22px);padding:8px;align-items:center}
.carrito svg{width:52px;height:52px}

.cajon svg{width:30px;height:30px}
.dinero{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

.cocina-juego{display:grid;gap:12px}

.botonera .opcion{min-width:120px;align-items:center;text-align:center}

  function etapasEnRuta(modulo, ruta, etapas) {

  /* ---------- M10 dentro de cada variante y por habilidad (EST-05, REQ-CLI-CHF-05). Heredado de FEC-015 hasta T3. ---------- */
  function ajusteM10(historial, grado, o = {}) {

/* Ayudas 1–3: 1 pista general; 2 ayuda específica (resaltar o sacar opciones); 3 demostración que explica y devuelve el turno (R10). */

/* Error: devolución neutra con pista; desde el primer error se ofrece la ayuda de nivel 1 (REQ-CLI-CHF-06). Sin cruces ni sonidos. */
function permitidos() { return Motor.tiposPermitidos(MODULO, S.aventura ? S.aventura.variante : S.variante, { rincon: S.aventura ? S.item.rincon : undefined, multiple: S.item && S.item.multiple }); }
/* candidatos: ids en orden de preferencia; se registra el primero de la lista cerrada (o «otro»). Con o.todos, cada uno (selección múltiple). */
function error(t, candidatos, cuantos = 1, o = {}) {

  R.errores += cuantos; R.intentos += 1;
  if (cuantos > 0) { const pm = permitidos(); if (o.todos) for (const c of candidatos) R.tipos.push(Motor.tipoCerrado(pm, c)); else R.tipos.push(Motor.tipoCerrado(pm, candidatos)); }

const tipoDe = (it, ...def) => [it.tipo_error, ...def].filter(Boolean);
function finItem(extra = {}) {
  const R = S.R, it = S.item; if (!R || R.terminado) return; R.terminado = true; R.intentos += 1;
  const mods = [...R.modalidades], modalidad = !mods.length ? "tocar" : mods.length > 1 ? "mixta" : mods[0];

  const reg = Motor.registro({ variante: vAct, rincon: v.rincon, estacion: v.estacion, grado: S.grado, item: enAv ? `${S.aventura.item.id}/e${S.aventura.i + 1}` : it.id, habilidad: hab,

    autocorreccion: R.autocorreccion, ms: Date.now() - R.t0, tipo_letra: S.letra,

/* M10, retiro de apoyos y error repetido sobre el registro de la variante (en el gran reto, sobre 8A u 8B; nunca sobre los rincones de origen). */
function cerrarRegistro(reg, devolucion) {
  const id = S.variante, v = variante();

  if (aj.grado !== S.grado) { S.grado = aj.grado; S.gradoDe[id] = aj.grado; if (aj.subio) S.sesion.subio = true; S.sesion.seguidos = 0; S.cuentaErr[ck] = {}; }
  if (aj.masAyuda) { S.apoyoSig[id] = Math.max(S.apoyoSig[id], 2); if (aj.grado === grados[0]) S.sesion.enPiso += 1; S.sesion.seguidos = 0; }

  S.sesion.items += 1;

/* ---------- El gran reto (8A y 8B): etapas de los rincones disponibles en la ruta ---------- */
function empezarAventura(it) {

function jugarEtapa() {

/* ---------- Cierre del rincón: tarjeta de «Mi recetario» por jugar (CHF-11), idea fuera de la pantalla, «Contar» y desafío para casa ---------- */

/* ---------- Tocar y ubicar, con arrastre opcional (WCAG 2.5.7) ---------- */
let ARR = null, ULTIMO_ARRASTRE = 0;
window.addEventListener("pointermove", (e) => {
  if (!ARR) return;
  if (!ARR.movio && Math.hypot(e.clientX - ARR.x, e.clientY - ARR.y) < 12) return;
  if (!ARR.movio) { ARR.movio = true; ARR.g = document.createElement("div"); ARR.g.className = "fantasma"; ARR.g.innerHTML = ARR.f.querySelector("svg") ? ARR.f.querySelector("svg").outerHTML : ""; document.body.appendChild(ARR.g); }
  ARR.g.style.left = e.clientX + "px"; ARR.g.style.top = e.clientY + "px";
});
window.addEventListener("pointerup", (e) => {
  if (!ARR) return; const a = ARR; ARR = null; if (!a.movio) return;
  a.g.remove(); ULTIMO_ARRASTRE = Date.now();
  const deb = document.elementFromPoint(e.clientX, e.clientY), d = deb && deb.closest("[data-destino]");
  if (d && a.raiz.contains(d)) { if (S.R) S.R.modalidades.add("arrastre"); a.soltar(); a.alUbicar(a.f.dataset.id, d.dataset.destino); }
});
function ubicable(raiz, alUbicar) {
  let elegida = null;
  const soltar = () => { if (elegida) elegida.setAttribute("aria-pressed", "false"); elegida = null; };
  raiz.addEventListener("click", (e) => {
    if (Date.now() - ULTIMO_ARRASTRE < 300) return;
    const f = e.target.closest(".ficha[data-id]:not(.puesta)"), d = e.target.closest("[data-destino]");
    if (f && !f.closest("[data-destino]")) { const misma = elegida === f; soltar(); if (!misma) { elegida = f; f.setAttribute("aria-pressed", "true"); } return; }
    if (d && elegida) { if (S.R) S.R.modalidades.add("tocar-y-ubicar"); const id = elegida.dataset.id; soltar(); alUbicar(id, d.dataset.destino); }
  });
  raiz.addEventListener("pointerdown", (e) => { const f = e.target.closest(".ficha[data-id]:not(.puesta)"); if (!f || f.closest("[data-destino]") || e.button > 0) return; ARR = { f, x: e.clientX, y: e.clientY, movio: false, g: null, raiz, alUbicar, soltar }; });
}

      marcoJuego(it, `<div class="estante" id="estante">${it.objetos.map((i) => `<button class="ficha con-nombre" data-id="${i}">${dib(i)}<span class="nom">${esc(nom(i))}</span></button>`).join("")}</div><h3>Hecho</h3><div class="mesada" id="mesada"></div>`);
      let k = 0;
      $$("#estante [data-id]").forEach((b) => b.onclick = () => { if (S.R.terminado || b.classList.contains("puesta")) return;
        if (b.dataset.id === it.orden[k]) { k += 1; b.classList.add("puesta"); $("#mesada").appendChild(b); if (k === it.orden.length) finItem(); }
        else error(it.pista1, it.orden.includes(b.dataset.id) ? ["orden_oracion"] : ["palabra_equivocada"]); });
      S.R.local.k = () => k;
    },
    ayuda(n, it) { const id = it.orden[S.R.local.k()]; if (n === 2) { msj("Primero lo primero que escuchaste."); return "resaltar"; } const b = $(`#estante [data-id="${id}"]`); if (b) b.classList.add("resaltada"); it._demo = "Ahora va este."; return "demostracion"; },
  },
  /* F9 · La cocina de juego (Rincón 7 y etapa de 8): acciones por botón; fuego, filo y electrodomésticos los usa el chef en 3–12 (REQ-CLI-CHF-12) */
  cocina: {
    render(it) {
      const ninos = ["3-5", "6-8", "9-12"].includes(S.ruta);
      const pasos = it.pasos, r = Motor.azar(Motor.semillaDe(it.id));
      const utsReceta = [...new Set(pasos.map((p) => p.utensilio))];
      const seguros = Motor.mezclar([...new Set(utsReceta.filter((u) => !UT[u].riesgo || !ninos).concat(Motor.mezclar(["bol", "cuchara", "plato", "taza", "espatula", "colador"].filter((u) => !utsReceta.includes(u)), r).slice(0, 2)))], r);
      const riesgosos = [...new Set(pasos.filter((p) => p.riesgo).map((p) => p.utensilio))];   // incluye el riesgo heredado (B1): colar, sumar a la olla
      const acciones = Motor.mezclar([...new Set(pasos.filter((p) => !p.riesgo || !ninos).map((p) => p.accion).concat(Motor.mezclar(["mezclar", "colocar", "servir", "distribuir", "lavar"], r).slice(0, 2)))], r);
      const modeloTxt = (p) => p.riesgo && ninos ? `El chef: ${p.texto.replace(/^El adulto /, "").toLowerCase()}.` : `El chef: ${BANCO.acciones[p.accion].toLowerCase()} con ${UT[p.utensilio].nombre}. Ahora vos.`;
      const lado = it.modelo === "a_pedido" ? `<button class="btn sec chico" id="ver-chef">Ver al chef</button>` : "";
      marcoJuego(it, `<div class="cocina-juego">
        <div class="modelo-chef" id="modelo" ${["permanente", "guia", "primer_paso"].includes(it.modelo) ? "" : "hidden"}>${D.personaje("chef")}<span class="modelo-ut" id="modelo-ut" aria-hidden="true"></span><span id="modelo-txt"></span></div>
        ${it.instrucciones_parciales ? `<p class="small">Pasos: ${esc(pasos.map((p, k) => (k % 2 ? "…" : p.texto)).join(" · "))}</p>` : ""}
        <div><h3>Utensilios</h3><div class="botonera" id="uts">${seguros.map((u) => `<button class="opcion sel-ut" data-ut="${u}" aria-pressed="false">${D.ut(BANCO, u)}<span class="t">${esc(UT[u].nombre)}</span></button>`).join("")}</div></div>
        <div><h3>Acciones</h3><div class="botonera" id="accs">${acciones.map((a) => `<button class="opcion sel-acc" data-acc="${a}" aria-pressed="false"><span class="t">${esc(BANCO.acciones[a])}</span></button>`).join("")}
          ${ninos ? riesgosos.map((u) => `<button class="opcion chef" data-chef="${u}">${D.ut(BANCO, u)}<span class="t">${esc(N.pedirChef)} use ${esc(["cuchara", "sarten", "hornalla", "olla", "fuente", "tabla", "taza", "licuadora", "batidora", "espatula"].includes(u) ? "la" : "el")} ${esc(UT[u].nombre)}</span></button>`).join("") : ""}</div></div>
        ${ninos ? "" : '<p class="guia" id="seguridad" hidden></p>'}<h3>Mesada</h3><ol class="pasos-hechos" id="hechos"></ol></div>`, lado);
      let k = 0, ut = null;
      /* O8 (RT-CHF-001-R v1.1): en 7A el chef hace primero el paso (dibujo del chef con el utensilio y la acción) y recién después se resaltan los botones. Sin parpadeos. */
      const mostrarModelo = () => { const p = pasos[k]; if (!p) return; const m = $("#modelo"), sg = $("#seguridad");
        if (sg) { sg.hidden = !p.riesgo; sg.textContent = p.riesgo ? (T.seguridad_13_18 || {})[p.riesgo] || "" : ""; }   // 13–18: pasos de seguridad a la vista
        const ve = it.modelo === "permanente" || it.modelo === "guia" || (it.modelo === "primer_paso" && k === 0);
        m.hidden = !ve;
        if (ve) { $("#modelo-ut").innerHTML = D.ut(BANCO, p.utensilio, true); $("#modelo-txt").textContent = it.modelo === "guia" ? `Paso ${k + 1}: ${p.texto}` : modeloTxt(p);
          m.classList.toggle("haciendo", false); void m.offsetWidth; m.classList.toggle("haciendo", true); }
        $$("[data-ut],[data-acc],[data-chef]").forEach((b) => b.classList.toggle("ofrecida", false));
        if (it.modelo === "permanente") { const R0 = S.R, k0 = k, sel = p.riesgo && ninos ? `[data-chef="${p.utensilio}"]` : `[data-ut="${p.utensilio}"],[data-acc="${p.accion}"]`;
          setTimeout(() => { if (S.R !== R0 || R0.terminado || k !== k0 || !m.isConnected) return; $$(sel).forEach((b) => b.classList.add("ofrecida")); }, 1200); } };
      const hecho = (p) => { $("#hechos").insertAdjacentHTML("beforeend", `<li class="${p.riesgo && ninos ? "adulto" : ""}">${esc(p.texto)}</li>`); k += 1; ut = null; $$("[data-ut],[data-acc]").forEach((b) => b.setAttribute("aria-pressed", "false")); msj(""); if (k === pasos.length) finItem(); else mostrarModelo(); };
      $$("[data-ut]").forEach((b) => b.onclick = () => { if (S.R.terminado) return; ut = b.dataset.ut; $$("[data-ut]").forEach((x) => x.setAttribute("aria-pressed", x === b)); });
      $$("[data-acc]").forEach((b) => b.onclick = () => {
        if (S.R.terminado) return; const p = pasos[k];
        if (p.riesgo && ninos) return error("Este paso lo hace el chef. Pedíselo.", ["accion"]);
        if (!ut) return msj("Primero elegí un utensilio.");
        if (ut === p.utensilio && b.dataset.acc === p.accion) hecho(p);
        else error(it.pista1, ut !== p.utensilio ? ["utensilio"] : ["accion"]);
      });
      $$("[data-chef]").forEach((b) => b.onclick = () => { if (S.R.terminado) return; const p = pasos[k];
        if (p.riesgo && p.utensilio === b.dataset.chef) hecho(p);   // pedirle al chef cuenta como paso correcto (caso 8)
        else error(p.riesgo ? it.pista1 : "Este paso lo podés hacer vos.", ["accion"]); });
      const vc = $("#ver-chef"); if (vc) vc.onclick = () => { registrarAcceso("modelo-de-secuencia"); const p = pasos[k]; $("#modelo").hidden = false; $("#modelo-txt").textContent = modeloTxt(p); };
      mostrarModelo(); S.R.local.k = () => k;
    },
    ayuda(n, it) { const p = it.pasos[S.R.local.k()]; if (!p) return "resaltar"; $("#modelo").hidden = false; $("#modelo-txt").textContent = p.texto;
      if (n === 3) { const sel = p.riesgo ? `[data-chef="${p.utensilio}"]` : `[data-ut="${p.utensilio}"],[data-acc="${p.accion}"]`; $$(sel).forEach((b) => b.classList.add("resaltada")); it._demo = `Ahora: ${p.texto.toLowerCase()}.`; return "demostracion"; }
      return "resaltar"; },
  },
};
function it_demo() { if (S.item) S.item._demo = "Mirá el gorro antes de ubicar."; }
/* Lista de la receta: visible (2A) o para recordar, que se tapa solo con «Ya miré», nunca por tiempo (REQ-CLI-CHF-07). */
function listaHTML(lista, recordar) {
  return `<div class="lista-receta" id="lista"><strong>Lista</strong><ul>${lista.map((i) => `<li>${D.ing(BANCO, i)} ${esc(nombreIng(i))}</li>`).join("")}</ul>${recordar ? `<button class="btn" id="ya-mire">${esc(N.yaMire)}</button>` : ""}</div>`;
}
function mostrarLista(ver) { const l = $("#lista"); if (l) l.classList.toggle("tapada", !ver); }
function prepararYaMire(it) {
  $("#ya-mire").onclick = () => { mostrarLista(false); $("#ya-mire").remove(); $("#zona-juego").hidden = false;
    if (it.agregado) msj(`Agregamos ${nombreIng(it.agregado)}.`);
    $("#lista").insertAdjacentHTML("beforeend", `<button class="btn sec chico" id="ver-otra">${esc(N.verLista)}</button>`);
    // T8: cada vez que se vuelve a ver la lista después de «Ya miré» es apoyo de aprendizaje nivel 2. No es error ni tiene devolución negativa.
    let viendo = false;
    $("#ver-otra").onclick = () => {
      if (!S.R || S.R.terminado) return;
      viendo = !viendo; mostrarLista(viendo);
      if (viendo) { S.R.apoyo_max = Math.max(S.R.apoyo_max, 2); if (S.R.apoyos.length < 20) S.R.apoyos.push("2:volver-a-ver-lista"); }
      $("#ver-otra").textContent = viendo ? N.yaMire : N.verLista;
    }; };
}
/* Calculadora simple, sin memoria (T13): 9–12 suma, resta y multiplicación; 13–18 las cuatro y %. Se calcula en código. */
function calculadoraHTML(ops) {
  const sim = { "+": "+", "-": "−", "*": "×", "/": "÷", "%": "%" };
  return `<div class="calculadora" id="calculadora" hidden role="group" aria-label="${esc(N.calculadora)}"><div class="pantalla-num" id="calc-pant">0</div>
    <div class="teclado calc">${[7, 8, 9, 4, 5, 6, 1, 2, 3, 0].map((d) => `<button class="btn sec" data-c="${d}">${d}</button>`).join("")}${ops.map((o) => `<button class="btn sec" data-c="${o}" aria-label="${o === "%" ? "por ciento" : sim[o]}">${sim[o]}</button>`).join("")}<button class="btn sec" data-c="=">=</button><button class="btn sec" data-c="C" aria-label="Borrar todo">C</button></div></div>`;
}
function prepararCalculadora(alAbrir) {
  let a = null, op = null, cur = "", abierta = false;
  const pant = () => { $("#calc-pant").textContent = cur || (a != null ? String(a) : "0"); };
  const hacer = (x, o, y) => o === "+" ? x + y : o === "-" ? x - y : o === "*" ? x * y : o === "/" ? (y ? x / y : x) : y;
  $("#calc").onclick = () => { abierta = !abierta; $("#calculadora").hidden = !abierta; if (abierta) alAbrir(); };
  $$("#calculadora [data-c]").forEach((b) => b.onclick = () => {
    const c = b.dataset.c;
    if (/^\d$/.test(c)) { if (cur.length < 9) cur += c; }
    else if (c === "C") { a = null; op = null; cur = ""; }
    else if (c === "%") { if (cur) { const y = +cur; cur = String(a != null && (op === "*" || op === "/") ? y / 100 : a != null ? a * y / 100 : y / 100); } }
    else if (c === "=") { if (op && cur) { a = Math.round(hacer(a, op, +cur) * 100) / 100; op = null; cur = ""; } }
    else { if (cur) { a = a == null || !op ? +cur : Math.round(hacer(a, op, +cur) * 100) / 100; cur = ""; } op = c; }
    pant();
  });
}
function cerrarExpo(ok) {
  if (!S.item.exposicion || S.sinExposicionBreve) return;
  const prev = S.registros.filter((r) => r.variante === "5-zona" && r.grado === "dificil").slice(-4).map((r) => r.resultado === "acierto" && r.errores === 0);
  const prec = (prev.filter(Boolean).length + (ok ? 1 : 0)) / (prev.length + 1);
  const r = Motor.exposicionSiguiente(S.expo, prec, MODULO.exposicion_5a, { ruta: S.ruta, desactivada: S.sinExposicionBreve });
  if (r.acorto) S.expo.acortoEnSesion = true; if (r.ms) S.expo.ms = r.ms;
  S.R.extra.precision = Math.round(prec * 100) / 100;
}
