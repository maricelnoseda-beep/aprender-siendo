     de la supervisora. Construida por DEV-IA como herramienta del portal (ADR-009). Corre aislada (iframe sin acceso a la app ni
     a sus datos) y también como archivo suelto para probar con doble clic.

<script id="motor">
"use strict";
/* ---------- Motor: lógica pura y determinista (la prueba tests/cerditos.test.js sin navegador) ----------
   Corrección por el banco, rutas, M10, escala de apoyos 0–3 con retiro progresivo y registro: todo en código.
   Ningún modelo de lenguaje (T11). Este bloque es el candidato a pasar al núcleo cuando se apruebe CRIT-003. */
const Motor = (() => {
  const GR = ["facil", "intermedio", "dificil"];
  const ACT = ["detectives", "memotest", "escena_frase", "rompecabezas", "ayudemos"];
  const RUTAS = ["3-5", "6-8", "9-12"];
  const CLASES = ["adecuada", "parcial", "no-adecuada"];
  const AUTONOMIA = ["autonomo", "con-pista", "con-ayuda-especifica", "con-demostracion"];
  const MOMENTOS = ["manana", "mediodia", "tarde", "noche"];
  const MODALIDADES = ["tocar", "tocar-y-ubicar", "arrastre", "mixta"];
  function azar(semilla) {
    let s = (semilla >>> 0) || 0x9e3779b9;
    return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }
  const mezclar = (arr, r) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  /* Mezcla que nunca deja el orden resuelto (si no, no hay nada que ordenar). */
  function mezclarDistinto(arr, r) {
    if (arr.length < 2) return arr.slice();
    for (let t = 0; t < 30; t++) { const a = mezclar(arr, r); if (a.some((x, i) => x !== arr[i])) return a; }
    return arr.slice().reverse();
  }
  const semillaDe = (texto, vuelta = 0) => { let h = 2166136261; for (const c of String(texto) + "#" + vuelta) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const limitar = (x, a, b) => Math.max(a, Math.min(b, Math.round(+x || 0)));

  /* ---------- Rutas (FEC-014 5.6; REQ-CLI-CER-04) ---------- */
  const deRuta = (valor, ruta) => (valor && typeof valor === "object" && !Array.isArray(valor) ? (ruta in valor ? valor[ruta] : valor["*"]) : valor);
  const variante = (modulo, act) => modulo.estaciones.variantes.find((v) => v.actividad === act) || {};
  const param = (modulo, act, grado) => ((variante(modulo, act).grados || {})[grado] || {}).parametros || {};
  const gradosDe = (modulo, ruta, act) => (((modulo.rutas[ruta] || {}).actividades || {})[act] || []).slice();
  const actividadesDe = (modulo, ruta) => ACT.filter((a) => gradosDe(modulo, ruta, a).length);
  /* Lleva actividad y grado a lo que la ruta publica. Si el grado no está, queda el más alto publicado por debajo. */
  function ajustarARuta(modulo, ruta, act, grado) {
    const acts = actividadesDe(modulo, ruta); if (!acts.length) return null;
    const a = acts.includes(act) ? act : acts[0], gs = gradosDe(modulo, ruta, a), i = GR.indexOf(grado);
    return { actividad: a, grado: gs.includes(grado) ? grado : (gs.filter((g) => GR.indexOf(g) <= i).pop() || gs[0]) };
  }
  const itemsDe = (banco, act, grado, ruta) => (((banco.actividades || {})[act] || {})[grado] || []).filter((it) => (it.rutas || RUTAS).includes(ruta));

  /* ---------- M10 (beta 2, 6.10) dentro de cada actividad y por habilidad (FEC 5.9). El tiempo no interviene (M10-7). ---------- */
  function ajusteM10(historial, grado, o = {}) {
    const m = o.m10 || { ventana: 10, minimo: 5, subir_aciertos: 0.85, subir_sin_ayuda: 0.7, mantener_desde: 0.6, errores_seguidos: 3 };
    const gs = o.grados && o.grados.length ? o.grados : GR, i = gs.indexOf(grado);
    if (o.fijo) return { grado, motivo: "fijado por el profesional (M10-9)" };
    if (o.erroresSeguidos >= m.errores_seguidos)
      return i > 0 ? { grado: gs[i - 1], motivo: "3 errores seguidos (M10-5)", masAyuda: true } : { grado, motivo: "3 errores seguidos en el grado mínimo", masAyuda: true };
    const v = historial.slice(-m.ventana);
    if (v.length < m.minimo) return { grado, motivo: "menos de 5 ítems (M10-2)" };
    const ac = v.filter((x) => x.acierto).length / v.length, sa = v.filter((x) => x.acierto && !x.conAyuda).length / v.length;
    if (ac >= m.subir_aciertos && sa >= m.subir_sin_ayuda && i < gs.length - 1 && !o.yaSubio) return { grado: gs[i + 1], motivo: "subir (M10-3)", subio: true };
    if (ac < m.mantener_desde && i > 0) return { grado: gs[i - 1], motivo: "menos de 60 % (M10-5)" };
    return { grado, motivo: "mantener (M10-4)" };
  }
  /* Act. 3: cada etapa alimenta su habilidad. Baja si alguna habilidad baja; sube solo si todas suben. */
  function combinarAjustes(ajustes, grado) {
    const masAyuda = ajustes.some((a) => a.masAyuda);
    const baja = ajustes.find((a) => GR.indexOf(a.grado) < GR.indexOf(grado));
    if (baja) return { ...baja, masAyuda };
    if (ajustes.length && ajustes.every((a) => a.subio)) return { ...ajustes[0], masAyuda };
    return { grado, motivo: ajustes.map((a) => a.motivo).join(" · "), masAyuda };
  }

  /* ---------- Escala de apoyos 0–3 (FEC 5.4) ----------
     Nivel 0: sin apoyo de aprendizaje; los apoyos de acceso (repetir, audio, zoom, tiempo, sin arrastre) nunca suben el nivel (R11).
     «Sin ayuda» para M10-3 = apoyo_max 0 (REQ-CLI-CER-08).
     Retiro progresivo (REQ-CLI-CER-09): el ítem siguiente de la misma actividad arranca con el apoyo un nivel por debajo del
     máximo del anterior; si terminó con 1, arranca en 0 con el botón de ayuda destacado. Nunca sube solo: las ayudas se piden. */
  function siguienteApoyo(apoyoMax) {
    const m = limitar(apoyoMax, 0, 3);
    return m >= 2 ? { nivel: m - 1, destacar: false } : { nivel: 0, destacar: m === 1 };
  }
  const sinAyuda = (r) => (r.apoyo_max | 0) === 0;
  const autonomia = (n) => AUTONOMIA[limitar(n, 0, 3)];

  /* Habilidad a la que se imputa el ítem (FEC 5.2 y 5.7; REQ-CLI-CER-12): si en una ruta que lee la persona escuchó la palabra o la
     frase objetivo, el resultado va a la habilidad oral y no a la de lectura, sin cambiar el apoyo. */
  function habilidadDe(modulo, act, ruta, grado, audioObjetivo, etapa) {
    const v = variante(modulo, act), L = v.lectura, lee = !!(modulo.rutas[ruta] || {}).lee;
    if (L && (L.etapa || null) === (etapa || null) && (!L.grados || L.grados.includes(grado))) return !lee || audioObjetivo ? L.oral : L.escrita;
    if (etapa && v.etapas_habilidad) return v.etapas_habilidad[etapa];
    return deRuta(v.habilidad_referencia, ruta);
  }

  /* Qué cuenta como acierto para M10 (modulo.criterio_acierto: propuesta de DEV-IA, la valida PSP-SR). */
  function acierto(act, r) {
    const E = r.etapas || {};
    if (act === "memotest") return r.errores <= (r.parejas || 0);
    if (act === "escena_frase") return aciertoEtapa(r, "asociar") && aciertoEtapa(r, "ordenar");
    if (act === "ayudemos") return ["plan", "eleccion", "imprevisto"].every((k) => !E[k] || E[k].primera === "adecuada")
      && (!E.pasos || E.pasos.errores === 0) && (!E.justificacion || E.justificacion.primera === "adecuada");
    return r.errores === 0;
  }
  function aciertoEtapa(r, etapa) {
    const E = r.etapas || {};
    if (etapa === "asociar") return !E.asociar || E.asociar.errores === 0;
    return (!E.ordenar || E.ordenar.errores === 0) && (!E.justificacion || E.justificacion.primera === "adecuada");
  }

  /* ---------- Registro mínimo por ítem (FEC 8). Normaliza y acota cada campo: nada de texto libre. ---------- */

/* ---------- Audio (T09). Repetir y escuchar son apoyos de acceso: nunca suben el nivel (R11). ---------- */

/* ---------- Encabezado ---------- */

/* ---------- Pantalla de la persona adulta: edad, actividad, grado y apoyo inicial ---------- */

      return `<button class="opcion" data-gr="${g}" aria-pressed="${g === S.grado}" ${ok ? "" : "disabled"}><span class="t">${n}</span>${ok ? "" : `<span class="d">No se publica para esta edad</span>`}</button>`; }).join("")}</div>
      <p class="small" id="a-desc"></p></div>

/* ---------- Descubrir: el cuento (REQ-CLI-CER-03) y la estrategia ---------- */
function empezarActividad() {
  if (!S.t0Sesion) S.t0Sesion = Date.now();
  if (!S.cuentoVisto.has(S.actividad)) return cuento(estrategia);
  estrategia();
}
function cuento(despues) {
  const L = BANCO.cuento[rutaCfg().final_cuento];

    const l = L[i], ult = i === L.length - 1;
    $("#app").innerHTML = `<section class="panel cierre" aria-labelledby="cu-t"><h1 id="cu-t">${esc(T.cuentoTitulo)}</h1>

  };

function estrategia() {

  $("#d-empezar").onclick = () => { $("#d-empezar").disabled = true; siguienteItem(); };

/* ---------- Ciclo de ítems, apoyos y registro ---------- */
function siguienteItem() {
  const lista = Motor.itemsDe(BANCO, S.actividad, S.grado, S.ruta);
  const k = S.actividad + "/" + S.grado + "/" + S.ruta;
  const i = S.idx[k] || 0; S.idx[k] = i + 1;
  S.item = lista[i % lista.length];
  S.vuelta = Math.floor(i / lista.length);
  const sig = S.actividad in S.apoyoSig ? S.apoyoSig[S.actividad] : S.apoyoInicial;
  S.R = { t0: Date.now(), errores: 0, intentos: 0, apoyos: [], apoyo_max: 0, apoyo_inicial: sig, nivelAyuda: 0, audio_objetivo: false, autocorreccion: false,
    etapas: {}, seguidos: 0, modalidades: new Set(), huboAyuda: false, terminado: false };

}
/* Retiro progresivo (REQ-CLI-CER-09): el apoyo de entrada se aplica y queda registrado como «inicial» y dentro de apoyo_max. */
function aplicarApoyoInicial() {
  const n = S.R.apoyo_inicial;
  for (let k = 1; k <= n; k++) usarAyuda(k, true);
  if (!n && S.destacar[S.actividad]) { const b = $("#ayuda"); if (b) b.classList.add("ofrecida"); }
}
function marcoJuego(consigna, cuerpo, lado = "") {
  // En Fácil e Intermedio el botón de ayuda está a la vista; en Difícil, disponible pero no destacado (FEC 5.4).
  const clase = S.grado === "dificil" ? "btn sec chico" : "btn suave";
  $("#app").innerHTML = `<section class="panel"><div class="consigna"><p id="consigna">${esc(consigna)}</p>${escuchar(consigna)}</div>
    <div class="juego"><div>${cuerpo}</div><div class="lado">${lado}<button class="${clase}" id="ayuda">${esc(T.ayuda)}</button><div class="msj" id="msj" aria-live="polite"></div></div></div></section>`;
  $("#ayuda").onclick = () => usarAyuda(Math.min(3, S.R.nivelAyuda + 1));
  decir(consigna);
}
function cambiarConsigna(t) { $("#consigna").textContent = t; $(".consigna [data-decir]").dataset.decir = t; }
function usarAyuda(nivel, inicial) {
  const R = S.R; if (!R || R.terminado || nivel < 1 || nivel > 3) return;
  R.nivelAyuda = Math.max(R.nivelAyuda, nivel); R.apoyo_max = Math.max(R.apoyo_max, nivel); R.seguidos = 0;
  if (!inicial) R.huboAyuda = true;
  const nombre = ACTIVIDADES[S.actividad].ayuda(nivel, S.item);
  R.apoyos.push((inicial ? "inicial:" : "") + nivel + ":" + (nombre || "ayuda"));
  const b = $("#ayuda"); if (b) { b.classList.remove("ofrecida"); if (R.nivelAyuda >= 3) b.disabled = true; }
}
function error(t, cuantos = 1) {
  const R = S.R; R.errores += cuantos; R.seguidos += 1;
  msj(t);
  if (R.seguidos >= 2 && R.nivelAyuda < 3) { const b = $("#ayuda"); if (b) b.classList.add("ofrecida"); setTimeout(() => { const m = $("#msj"); if (m) m.textContent = t + " " + T.ofrecerAyuda; }, 0); }
}
function finItem(extra = {}) {
  const R = S.R, v = variante(), act = S.actividad;

  const mods = [...R.modalidades], modalidad = !mods.length ? "tocar" : mods.length > 1 ? "mixta" : mods[0];
  const etapas = { ...R.etapas, ...(extra.etapas || {}) };
  const reg = Motor.registro({ actividad: act, estacion: v.estacion, grado: S.grado, item: S.item.id, habilidad: Motor.habilidadDe(MODULO, act, S.ruta, S.grado, R.audio_objetivo),
    resultado: extra.resultado, errores: R.errores, intentos: R.intentos, apoyos: R.apoyos, apoyo_inicial: R.apoyo_inicial, apoyo_max: R.apoyo_max,
    audio_objetivo: R.audio_objetivo, modalidad, autocorreccion: R.autocorreccion, etapas, ms: Date.now() - R.t0 });
  const ok = Motor.acierto(act, { ...reg, parejas: (S.item.parejas || []).length });
  S.registros.push(reg);
  if (EN_MARCO) parent.postMessage({ type: "cerditos-item", acierto: ok, ...reg }, "*");
  // Retiro progresivo (REQ-CLI-CER-09)
  const sig = Motor.siguienteApoyo(reg.apoyo_max); S.apoyoSig[act] = sig.nivel; S.destacar[act] = sig.destacar;
  // M10 dentro de la actividad y por habilidad; «con ayuda» = apoyo_max mayor que 0 (REQ-CLI-CER-08)
  const conAyuda = !Motor.sinAyuda(reg);
  const porHab = act === "escena_frase" ? [[reg.etapas.asociar.habilidad, Motor.aciertoEtapa(reg, "asociar")], [reg.etapas.ordenar.habilidad, Motor.aciertoEtapa(reg, "ordenar")]] : [[reg.habilidad, ok]];
  S.sesion.seguidos = ok ? 0 : S.sesion.seguidos + 1;
  const opc = { m10: MODULO.m10, fijo: S.fijo, yaSubio: S.sesion.subio, erroresSeguidos: S.sesion.seguidos, grados: Motor.gradosDe(MODULO, S.ruta, act) };
  const aj = Motor.combinarAjustes(porHab.map(([h, ac]) => { const key = act + "/" + h, hh = S.hist[key] || (S.hist[key] = []); hh.push({ acierto: ac, conAyuda }); return Motor.ajusteM10(hh, S.grado, opc); }), S.grado);
  let nuevo = "";
  if (aj.grado !== S.grado) { S.grado = aj.grado; if (aj.subio) S.sesion.subio = true; nuevo = " " + T.algoNuevo; S.sesion.seguidos = 0; }
  if (aj.masAyuda) { S.apoyoSig[act] = Math.max(S.apoyoSig[act], 2); if (aj.grado === opc.grados[0]) S.sesion.enPiso += 1; S.sesion.seguidos = 0; }
  S.sesion.items += 1;
  const piso = S.sesion.enPiso >= 2;   // M10-6: sin bucles de error, se deja la actividad por esta sesión
  if (piso && EN_MARCO) parent.postMessage({ type: "cerditos-piso" }, "*");
  const tiempo = Date.now() - S.t0Sesion >= rutaCfg().sesion_min * 60000;   // T08: cierre suave por tiempo de sesión de la ruta
  const fin = piso || tiempo || S.sesion.items >= rutaCfg().items_por_ronda;
  const lado = $(".lado"), ay = $("#ayuda"); if (ay) ay.remove();
  lado.insertAdjacentHTML("beforeend", `<button class="btn" id="j-seguir">${esc(T.seguir)}</button>`);
  msj((extra.devolucion || S.item.ok || T.devolucion_ok[act]) + nuevo);
  $("#j-seguir").focus();
  $("#j-seguir").onclick = () => (fin ? cierre(piso ? "piso" : tiempo ? "tiempo" : "ronda") : siguienteItem());
}

/* ---------- Cierre: avance por participación, idea fuera de la pantalla (R9) y «Contar» (M07) ---------- */
function cierre(motivo) {

/* ---------- Tablero para ubicar fichas en ranuras (ordenar escenas y rompecabezas). Siempre se puede sin arrastre (WCAG 2.5.7):
   se toca la ficha y después la ranura, también con teclado (2.1.1). En el rompecabezas también se puede arrastrar; la modalidad
   se registra como contexto y no cambia las habilidades declaradas (REQ-CLI-CER-10).
   «al-poner»: la ficha solo entra donde va. «al-final»: se ubica libremente y se revisa al terminar; mover una ficha mal puesta antes
   de revisar y sin ayuda es autocorrección, nunca error. ---------- */
function Tablero(opt) {
  const n = opt.total, ranuras = Array(n).fill(null), fijas = new Set(opt.fijas || []);
  fijas.forEach((k) => { ranuras[k] = k; });
  let sel = null, drag = null, ignorarClick = false;
  const cont = $(opt.donde);
  const completoOk = () => Motor.completo(ranuras);
  function pintar() {
    const libres = opt.orden.filter((k) => !ranuras.includes(k));
    cont.innerHTML = `<div class="tablero" style="grid-template-columns:repeat(${opt.cols},minmax(0,1fr))">${ranuras.map((f, i) =>
      `<button class="ranura${f !== null ? " llena" : ""}${fijas.has(i) ? " fija" : ""}" data-ran="${i}" aria-label="${esc(opt.etiquetaRanura(i, f))}" ${fijas.has(i) ? 'aria-disabled="true"' : ""} style="${opt.estiloRanura || ""}">${f !== null ? `<span class="ficha" data-puesta="${i}">${opt.ficha(f)}</span>` : (opt.etqRanura ? `<span class="etq">${esc(opt.etqRanura(i))}</span>` : "")}</button>`).join("")}</div>
      <div class="bandeja" role="group" aria-label="${esc(T.paraUbicar)}">${libres.map((k) => `<button class="ficha${opt.claseFicha ? " " + opt.claseFicha : ""}" data-ficha="${k}" aria-pressed="${sel === k}" aria-label="${esc(opt.etiquetaFicha(k))}">${opt.ficha(k)}</button>`).join("")}</div>
      ${opt.verificar === "al-final" && !libres.length && !completoOk() ? `<div class="acciones"><button class="btn" id="t-revisar">${esc(T.revisar)}</button></div>` : ""}`;
  }
  const bloqueado = () => { const m = opt.bloqueado && opt.bloqueado(); if (m) msj(m, false); return !!m; };
  cont.addEventListener("click", (e) => {
    if (ignorarClick) { ignorarClick = false; return; }
    if (e.target.closest("#t-revisar")) return revisar();
    const f = e.target.closest("[data-ficha]"), r = e.target.closest("[data-ran]");
    if ((f || r) && bloqueado()) return;
    if (f) { const k = +f.dataset.ficha; sel = sel === k ? null : k; pintar(); const b = $(`[data-ficha="${sel}"]`, cont); if (b) b.focus(); return; }
    if (r) tocarRanura(+r.dataset.ran, "tocar-y-ubicar");
  });
  function levantar(i) { const f = ranuras[i]; if (f !== i && !S.R.huboAyuda) S.R.autocorreccion = true; ranuras[i] = null; sel = f; }
  function tocarRanura(i, modo) {
    if (fijas.has(i) || S.R.terminado) return;
    if (sel === null) { if (ranuras[i] !== null && opt.verificar === "al-final") { levantar(i); pintar(); } return; }
    S.R.intentos += 1;
    if (opt.verificar === "al-poner") {
      if (ranuras[i] !== null) return;
      if (sel !== i) { error(opt.textoError); pintar(); return; }
      ranuras[i] = sel; sel = null; S.R.seguidos = 0;
    } else if (ranuras[i] !== null) { const prev = ranuras[i]; ranuras[i] = sel; sel = prev; } else { ranuras[i] = sel; sel = null; }
    S.R.modalidades.add(modo); pintar();
    if (completoOk()) opt.alTerminar();
  }
  function ranuraEn(x, y) {
    const el = document.elementFromPoint(x, y), r = el && el.closest("[data-ran]");
    if (r && cont.contains(r)) return +r.dataset.ran;
    let mejor = null, dist = opt.tolerancia || 0;      // tolerancia de encastre (amplia en 3–5)
    $$("[data-ran]", cont).forEach((b) => { const q = b.getBoundingClientRect(), dx = Math.max(q.left - x, 0, x - q.right), dy = Math.max(q.top - y, 0, y - q.bottom), d = Math.hypot(dx, dy); if (d <= dist) { dist = d; mejor = +b.dataset.ran; } });
    return mejor;
  }
  if (opt.arrastre) {
    cont.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      const f = e.target.closest("[data-ficha]"), p = opt.verificar === "al-final" ? e.target.closest("[data-puesta]") : null;
      if (f || p) drag = { x0: e.clientX, y0: e.clientY, k: f ? +f.dataset.ficha : null, desde: p ? +p.dataset.puesta : null, el: f || p, activo: false };
    });
    document.addEventListener("pointermove", (e) => {
      if (!drag) return;
      if (!drag.activo) {
        if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 8) return;
        if (bloqueado()) { drag = null; return; }
        drag.activo = true; drag.fantasma = document.createElement("div"); drag.fantasma.className = "fantasma"; drag.fantasma.innerHTML = drag.el.innerHTML; document.body.appendChild(drag.fantasma);
      }
      drag.fantasma.style.left = e.clientX + "px"; drag.fantasma.style.top = e.clientY + "px"; e.preventDefault();
    }, { passive: false });
    document.addEventListener("pointerup", (e) => {
      if (!drag) return; const d = drag; drag = null; if (!d.activo) return;
      d.fantasma.remove(); ignorarClick = true; setTimeout(() => { ignorarClick = false; }, 0);
      const i = ranuraEn(e.clientX, e.clientY);
      if (i === null || fijas.has(i) || (d.desde !== null && d.desde === i)) { pintar(); return; }
      if (d.desde !== null) levantar(d.desde); else sel = d.k;
      tocarRanura(i, "arrastre");
    });
    document.addEventListener("pointercancel", () => { if (drag && drag.fantasma) drag.fantasma.remove(); drag = null; });
  }
  function revisar() {
    const mal = Motor.malUbicadas(ranuras);
    if (!mal.length) return opt.alTerminar();
    S.R.revisiones = (S.R.revisiones || 0) + 1;
    mal.forEach((i) => { ranuras[i] = null; });
    error(mal.length === 1 ? T.unaNoEstaba : T.variasNoEstaban.replace("{n}", mal.length), mal.length);
    pintar();
  }
  pintar();
  return {
    ranuras,
    marcarMal() { const mal = Motor.malUbicadas(ranuras); mal.forEach((i) => { const b = $(`[data-ran="${i}"]`, cont); if (b) b.classList.add("marcada"); }); return mal.length; },
    marcarLugar(k) { const b = $(`[data-ran="${k}"]`, cont); if (b) b.classList.add("marcada"); },
    seleccionada: () => sel,
    primeraLibre: () => opt.orden.find((k) => ranuras[k] !== k),
    ubicar(k) { const j = ranuras.indexOf(k); if (j >= 0) ranuras[j] = null; ranuras[k] = k; sel = null; pintar(); if (completoOk()) opt.alTerminar(); }
  };
}

    tocarPaso(id) {
      const it = S.item, R = S.R; if (R.terminado) return;
      const P = R.etapas.pasos || (R.etapas.pasos = { errores: 0 }); R.intentos += 1;
      const esperado = it.pasos.orden[this.hechos.length].id;
      if (id === esperado) { this.hechos.push(id); R.seguidos = 0; this.marcada = null; if (this.hechos.length === it.pasos.orden.length) return this.terminar(); return this.pintar(); }
      P.errores += 1; error(T.errorPaso);
    },
    justificar(i) {
      const R = S.R, o = S.item.justificacion.opciones[i]; if (R.terminado) return;
      const cl = Motor.claseJust(o, R.etapas.imprevisto.ultima);
      const J = R.etapas.justificacion || (R.etapas.justificacion = { primera: null, final: null, intentos: 0 }); J.intentos += 1;
      if (J.primera === null) J.primera = cl;
      J.final = cl;
      if (cl === "adecuada") return this.terminar();
      this.quitadas.add("j" + i); error(T.errorJustAyudemos); this.pintar();
    },
    terminar() {
      const E = S.R.etapas, decisiva = E.imprevisto || E.eleccion, cambio = Object.values(E).some((x) => x && x.cambio);
      for (const x of Object.values(E)) if (x && typeof x === "object") delete x.ultima;
      finItem({ resultado: decisiva.final, devolucion: cambio ? T.devolucion_cambio : T.devolucion_ok.ayudemos });
    },
    ayuda(n, it) {
      const f = this.fase;
      if (n === 1) {
        if (f === "pasos") { msj(T.pistaPasos); return "pista-general"; }
        if (f === "justificar") { msj(T.pistaJustAyudemos); return "pista-general"; }
        const c = $("#s-cond"); if (c) c.classList.add("resaltada");
        msj(T.mirarCondiciones + " " + it.condiciones.map((x) => x.txt).join(". ") + "."); return "volver-a-ver-las-condiciones";
      }
      if (n === 2) {
        if (f === "pasos") { this.marcada = it.pasos.orden[this.hechos.length].id; this.pintar(); msj(T.pasoMarcado); return "senalar-paso"; }
        if (f === "justificar") { const el = S.R.etapas.imprevisto.ultima, i = it.justificacion.opciones.findIndex((o, k) => !this.quitadas.has("j" + k) && Motor.claseJust(o, el) === "no-adecuada"); if (i >= 0) this.quitadas.add("j" + i); this.pintar(); msj(T.quedanMenos); return "descartar-alternativa"; }
        const m = this.ops().find((o) => o.clase === "no-adecuada" && !this.quitadas.has(f + ":" + o.id)); if (m) this.quitadas.add(f + ":" + m.id); this.pintar(); msj(T.quedanMenos); return "descartar-alternativa";
      }
      if (f === "pasos") { const p = it.pasos.orden[this.hechos.length]; this.tocarPaso(p.id); if (!S.R.terminado) msj(T.demoPaso.replace("{paso}", p.txt)); return "demostracion"; }
      if (f === "justificar") { const el = S.R.etapas.imprevisto.ultima, i = it.justificacion.opciones.findIndex((o) => Motor.claseJust(o, el) === "adecuada"); this.marcada = "j" + i; this.pintar(); msj(T.demoJust); return "demostracion"; }
      const a = this.ops().find((o) => o.clase === "adecuada"); this.marcada = a.id; this.pintar();
      msj(T.demoOpcion.replace("{condiciones}", it.condiciones.map((x) => x.txt.toLowerCase()).join(" y "))); return "demostracion";
    }
  }
};

/* ---------- Arranque ---------- */
encabezado();
if (EXCLUIDA) $("#app").innerHTML = `<section class="panel"><h1>${esc(MODULO.nombre)}</h1><p>${esc(T.noDisponibleEdad)}</p></section>`;
else if (CON_ADULTO) pantallaAdulto(); else empezarActividad();
</script>
