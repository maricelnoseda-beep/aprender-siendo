# Entorno de prueba (solo datos sintéticos): despliegue automático desde main.
# Requiere el secreto CLOUDFLARE_API_TOKEN y la variable CLOUDFLARE_ACCOUNT_ID,
# cargados por el responsable en GitHub (Settings > Secrets). Nunca en el código.
name: Entorno de prueba
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha }}" }
      - run: python3 app/build.py
      - name: Publicar en Cloudflare Pages (beta.aprendersiendo.ar)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/dist --project-name=aprender-siendo-beta --branch=main
