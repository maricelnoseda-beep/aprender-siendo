<script id="motor">
"use strict";
/* ---------- Motor: lógica pura y determinista con semilla (la prueba tests/luci.test.js sin navegador) ----------
   Compone cada ítem a partir de una lámina del banco, resuelve las pistas, decide qué se tocó y aplica las reglas
   de dificultad en código (M10). Ningún modelo de lenguaje interviene (DEV-IA §4). */
const Motor = (() => {
  const VB = { w: 1200, h: 800 };
  const GR = ["facil", "intermedio", "dificil"];
  function azar(semilla) {
    let s = (semilla >>> 0) || 0x9e3779b9;
    return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }
  const mezclar = (arr, r) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const uno = (arr, r) => arr[Math.floor(r() * arr.length)];
  const choca = (a, b, gap) => a.x < b.x + b.w + gap && b.x < a.x + a.w + gap && a.y < b.y + b.h + gap && b.y < a.y + a.h + gap;

  /* Catálogo de una ruta (REQ-CLI-LUC-09): solo variantes y grados con versión para esa ruta. */
  function variantesDeRuta(modulo, ruta) {
    const pub = (modulo.publicacion || {})[ruta] || {};
    return modulo.estaciones.variantes.filter((v) => (pub[v.estacion] || []).length).map((v) => ({ estacion: v.estacion, grados: pub[v.estacion].slice() }));
  }
  const conversarEnRuta = (modulo, ruta) => !!((modulo.publicacion || {})[ruta] || {}).conversar;
  const estiloDeRuta = (modulo, ruta) => ((modulo.rutas || {})[ruta] || {}).estilo || "infantil";

  /* Láminas disponibles para una variante, grado y estilo. */
  const laminasDe = (banco, variante, grado, estilo) => banco.laminas.filter((l) => l.variante === variante && l.grado === grado && l.estilo === estilo);

  /* Ubica rectángulos sin superponerse dentro del área de la escena. */
  function ubicador(r, area, gap) {
    const puestos = [];
    return {
      puestos,
      poner(w, h, fijo) {
        if (fijo) { const q = { x: fijo.x, y: fijo.y, w, h }; puestos.push(q); return q; }
        for (let t = 0; t < 600; t++) {
          const q = { x: area.x + r() * (area.w - w), y: area.y + r() * (area.h - h), w, h };
          if (!puestos.some((p) => choca(p, q, gap))) { puestos.push(q); return q; }
        }
        return null;
      }
    };
  }
  const AREA = { infantil: { x: 24, y: 210, w: 1152, h: 566 }, editorial: { x: 24, y: 150, w: 1152, h: 626 } };

  /* Arma un ítem. Devuelve la escena con elementos, objetivos y lo que hace falta para mostrarlo. */
  function componer(lamina, banco, modulo, opciones = {}) {
    const r = azar(lamina.semilla + (opciones.vuelta || 0) * 7919);
    const O = banco.objetos, estilo = lamina.estilo, fondo = banco.fondos[lamina.fondo];
    const variante = modulo.estaciones.variantes.find((v) => v.estacion === lamina.variante);
    const p = variante ? variante.grados[lamina.grado].parametros : {};
    const esc = { vb: VB, lamina: lamina.id, variante: lamina.variante, grado: lamina.grado, estilo, fondo: lamina.fondo, elementos: [], objetivos: [], p };
    const ub = ubicador(r, AREA[estilo] || AREA.infantil, estilo === "editorial" ? 18 : 14);
    let uid = 0;
    const agregar = (oid, rol, extra = {}, fijo) => {
      const ob = O[oid]; if (!ob) return null;
      const k = (extra.escala || (rol === "relleno" ? 0.9 + r() * 0.35 : 1)) * (estilo === "editorial" ? 1.2 : 1.3);
      const w = Math.round((extra.w || ob.w) * k), h = Math.round((extra.h || ob.h) * k);
      const q = ub.poner(w, h, fijo); if (!q) return null;
      const e = { uid: "e" + (++uid), obj: oid, forma: ob.forma, color: extra.color || ob.color, categoria: ob.categoria, rol, x: Math.round(q.x), y: Math.round(q.y), w, h,
        marca: !!extra.marca, attrs: extra.attrs || {}, tocable: extra.tocable !== false };
      esc.elementos.push(e); return e;
    };
    const objetivoPrincipal = estilo === "editorial" ? "marca-luci" : "luci";
    const relleno = (n, excluir) => {
      const pool = Object.keys(O).filter((k) => { const ob = O[k];
        if (ob.rol !== "relleno" || ob.color === "sol" || excluir(k, ob)) return false;
        if (estilo === "editorial") return ob.categoria === "pictograma" || ["libro", "util", "caja", "vehiculo", "mueble", "persona", "abrigo", "cocina"].includes(ob.categoria);
        return ob.categoria !== "pictograma"; });
      for (let i = 0; i < n * 3 && esc.elementos.length < n + esc.objetivos.length + 40 && pool.length; i++) {
        if (esc.elementos.filter((e) => e.rol === "relleno").length >= n) break;
        agregar(uno(pool, r), "relleno");
      }
    };
    const SOL_INF = ["flor-sol", "pelota-sol", "mariposa-sol", "hoja-sol", "estrella-sol", "limon"];
    const SOL_ED = ["cuadro-sol", "triangulo-sol", "rombo-sol", "estrella-sol"];

    if (lamina.variante === "explorar") {
      const t = agregar(objetivoPrincipal, "objetivo", { escala: (p.tam || 70) / 70 });
      esc.objetivos.push(t.uid);
      if (p.pasos === 2) { const f = agregar("farolito", "objetivo2", { marca: true }); esc.objetivos.push(f.uid); }
      for (let i = 0; i < (p.senuelos_color || 0); i++) agregar(uno(estilo === "editorial" ? SOL_ED : SOL_INF, r), "senuelo-color");
      relleno(p.elementos - (p.senuelos_color || 0), (k, ob) => ob.forma === "farolito");
      esc.consigna = estilo === "editorial" ? (p.pasos === 2 ? "marca2a" : "marca1") : (p.pasos === 2 ? "explorar2a" : "explorar1");
      esc.modelo = [objetivoPrincipal].concat(p.pasos === 2 ? ["farolito"] : []);
    } else if (lamina.variante === "reconocer") {
      if (p.atributo) {
        const at = uno(["mochila-abierta", "taza-chica", "farolito-arriba"], r);
        esc.atributo = at;
        if (at === "farolito-arriba") {
          // Cada banco se ubica con su espacio arriba y al costado reservado; el farolito va arriba de uno solo y al costado de los demás.
          const f = { w: Math.round(O.farolito.w * 1.3), h: Math.round(O.farolito.h * 1.3) }, bw = 135, bh = 60;
          for (let i = 0; i < 5; i++) {
            const q = ub.poner(bw + f.w + 6, bh + f.h + 4); if (!q) continue;
            const b = { uid: "e" + (++uid), obj: "banco-plaza", forma: "banco", color: "verde", categoria: "mueble", rol: "apoyo", x: Math.round(q.x), y: Math.round(q.y + f.h + 4), w: bw, h: bh, marca: false, attrs: {}, tocable: true };
            const fx = i === 0 ? b.x + bw / 2 - f.w / 2 : b.x + bw + 6, fy = i === 0 ? q.y : b.y + bh - f.h;
            const e = { uid: "e" + (++uid), obj: "farolito", forma: "farolito", color: "sol", categoria: "farolito", rol: i === 0 ? "objetivo" : "senuelo-atributo",
              x: Math.round(fx), y: Math.round(fy), w: f.w, h: f.h, marca: false, attrs: { arribaDe: i === 0 ? b.uid : null, alLadoDe: i === 0 ? null : b.uid }, tocable: true };
            esc.elementos.push(b, e); if (i === 0) esc.objetivos.push(e.uid);
          }
        } else {
          const oid = at === "mochila-abierta" ? "mochila" : "taza";
          const t = agregar(oid, "objetivo", at === "mochila-abierta" ? { attrs: { abierta: true } } : { escala: 0.62, attrs: { chica: true } });
          esc.objetivos.push(t.uid);
          const cols = ["verde", "coral", "lila", "verde"];
          for (let i = 0; i < p.senuelos_categoria; i++)
            agregar(oid, "senuelo-atributo", at === "mochila-abierta" ? { color: cols[i % 4], attrs: { abierta: false } } : { escala: 1 + 0.12 * i, color: cols[i % 4] });
        }
        esc.consigna = "atributo";
      } else {
        const oid = uno(["farolito", "mochila", "bufanda", "libreta", "mapa", "taza"], r);
        const t = agregar(oid, "objetivo", { marca: true }); esc.objetivos.push(t.uid);
        const cols = [O[oid].color, "coral", "lila", O[oid].color];
        for (let i = 0; i < (p.senuelos_categoria || 0); i++) agregar(oid, "senuelo-categoria", { color: cols[i % 4] });
        esc.buscado = oid;
        esc.consigna = p.presentacion === "dibujo-y-audio" ? "reconocerDibujo" : "reconocerNombre";
        if (p.presentacion === "dibujo-y-audio") esc.modelo = [oid];
      }
      const formasObj = new Set(esc.elementos.map((e) => e.forma));
      relleno(p.elementos - esc.elementos.length, (k, ob) => formasObj.has(ob.forma));
    } else if (lamina.variante === "integrar") {
      if (p.consigna === "categoria") {
        const usos = ["frio", "lluvia", "paseo"].filter((u) => {
          const c = Object.keys(O).filter((k) => O[k].usos.includes(u) && O[k].categoria !== "luci");
          return c.filter((k) => O[k].material === "tela").length >= 3 && c.some((k) => O[k].material !== "tela");
        });
        const uso = uno(usos, r);
        const cands = Object.keys(O).filter((k) => O[k].usos.includes(uso) && O[k].categoria !== "luci");
        for (const k of cands) { const e = agregar(k, "categoria"); if (e) esc.objetivos.push(e.uid); }
        esc.regla = { uso, material: "tela", necesarios: 3 };
        esc.consigna = "integrarCategoria";
        relleno(p.elementos - esc.elementos.length, (k, ob) => ob.usos.includes(uso));
      } else {
        const listables = Object.keys(O).filter((k) => O[k].rol === "relleno" && O[k].color !== "sol" && !["persona", "pictograma", "mueble"].includes(O[k].categoria)
          && (estilo !== "editorial" || ["libro", "util", "caja", "vehiculo", "abrigo", "cocina"].includes(O[k].categoria)));
        const formas = []; const lista = [];
        for (const k of mezclar(listables, r)) { if (lista.length >= p.lista) break; if (formas.includes(O[k].forma)) continue; formas.push(O[k].forma); lista.push(k); }
        for (const k of lista) { const e = agregar(k, "lista"); esc.objetivos.push(e.uid); }
        esc.lista = lista;
        esc.consigna = "integrarObjetos";
        relleno(p.elementos - esc.elementos.length, (k, ob) => formas.includes(ob.forma));
      }
      if (p.zonas_dibujadas) esc.zonas4 = true;
    } else if (lamina.variante === "transferir") {
      if (fondo.tabla) {
        const T = banco.tablas[fondo.tabla];
        // La tabla se rearma hasta que las pistas dejen una sola fila (con datos al azar no siempre se puede).
        for (let intento = 0; intento < 60 && !esc.pistas; intento++) {
        const filas = mezclar(T.lineas, r).map((linea, i) => {
          const hora = fondo.tabla === "horario" ? 6 * 60 + 30 + Math.floor(r() * 7) * 15 : 15 * 60 + Math.floor(r() * 8) * 30;
          const limite = fondo.tabla === "horario" ? 8 * 60 : 18 * 60;
          const destino = uno(T.destinos, r);
          const sale = fondo.tabla === "horario" ? hora - 25 - Math.floor(r() * 3) * 5 : hora;
          return { id: "f" + i, nombre: linea, celdas: [linea, destino, hhmm(sale), hhmm(hora)], attrs: { antes: hora < limite, destino, linea } };
        });
        const pool = [{ clave: "antes", valor: true, texto: T.pista_hora }, { clave: "antes", valor: false, texto: T.pista_hora_neg }];
        for (const d of T.destinos) { pool.push({ clave: "destino", valor: d, texto: T.pista_destino.replace("{destino}", d) }); pool.push({ clave: "destino", valor: d, inferencia: true, texto: T.inferencias[d] }); }
        for (const l of T.lineas) pool.push({ clave: "linea", valor: l, negar: true, texto: T.pista_linea_neg.replace("{linea}", l) });
        const x0 = 80, y0 = 150, anchos = [260, 340, 200, 200], alto = 92;
        filas.forEach((f, k) => { f.x = x0; f.y = y0 + k * alto; f.w = 1000; f.h = alto - 8; });
        esc.lugares = filas; esc.tabla = { titulo: T.titulo, columnas: T.columnas, anchos, x0, y0 };
        esc.pistas = resolverPistas(filas, pool, p, r);
        }
        esc.consigna = "transferirTabla";
      } else {

  if (!l) { pintar(); return; }
  if (it.modoE4 === "descartar") { it.descartes.has(l.id) ? it.descartes.delete(l.id) : it.descartes.add(l.id); pintar(); return anunciar(it.descartes.has(l.id) ? T.descartado : l.nombre); }
  if (e.p.descarte === "automatico" && !Motor.lugaresPosibles(e, it.pistasVistas).includes(l.id)) { pintar(); return mensaje(fmt(T.senuelo.lugar, { pista: (Motor.primeraQueNoCumple(e, l.id) || {}).texto || "" })); }
  const confirmar = () => {
    if (l.id === e.objetivo) { it.mostrarLuci = l.id; return hallado({ uid: l.id }, elegir(editorial() ? T.acierto.transferirAdolescente : T.acierto.transferir)); }
    const c = Motor.primeraQueNoCumple(e, l.id); error(fmt(T.senuelo.lugar, { pista: c ? c.texto : "" }));
  };
  if (e.p.verificar) return dialogoVerificar(l, confirmar);
  confirmar();
}
function dialogoVerificar(l, confirmar) {
  const e = S.item.esc, d = document.createElement("div");
  d.className = "dialogo"; d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true"); d.setAttribute("aria-labelledby", "v-t");
  d.innerHTML = `<div class="panel"><div class="titulo"><h2 id="v-t">${esc(T.verificarTitulo)}</h2>${escuchar(T.verificarTitulo + " " + e.pistas.lista.map((c) => c.texto).join(" "))}</div><p><strong>${esc(l.nombre)}</strong></p>
    <ul class="lista pistas">${e.pistas.lista.map((c) => `<li>${esc(c.texto)}</li>`).join("")}</ul>
    <div class="acciones"><button class="btn" id="v-si">${esc(T.verificarSi)}</button><button class="btn sec" id="v-no">${esc(T.verificarNo)}</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector("[data-decir]").onclick = (ev) => decir(ev.currentTarget.dataset.decir, true);
  const cerrar = () => { d.remove(); $("#escena") && $("#escena").focus(); };
  d.querySelector("#v-si").onclick = () => { cerrar(); confirmar(); };
  d.querySelector("#v-no").onclick = () => { S.item.autocorrecciones = (S.item.autocorrecciones || 0) + 1; cerrar(); };
  d.addEventListener("keydown", (ev) => { if (ev.key === "Escape") cerrar(); });
  d.querySelector("#v-si").focus();
}
function hallado(el, texto) {
  const it = S.item, e = it.esc;
  it.encontrados.push(el.uid); S.sesion.seguidos = 0; it.resaltar = it.encontrados.slice();
  let listo = true;
  if (e.variante === "explorar" && e.p.pasos === 2) listo = it.encontrados.length >= 2;
  if (e.lista) listo = e.objetivos.every((u) => it.encontrados.includes(u));
  if (e.regla) {
    if (it.fase === 1) { it.fase = 2; texto += " " + fmt(T.consignas.integrarCambio, { material: T.materiales[e.regla.material] }); }
    listo = it.encontrados.length >= e.regla.necesarios;
  }
  if (listo) return terminarItem(true, e.lista || e.regla ? elegir(T.acierto.integrarFin) : texto);
  if (e.lista || e.regla || e.modelo) { pJuego(false, true); mensaje(texto); } else { pintar(); mensaje(texto); }
}
function error(texto) {
  const it = S.item; it.senuelos++; S.sesion.seguidos++;
  pintar(); mensaje(texto);
  const m = MODULO.m10;
  if (S.sesion.seguidos >= m.errores_seguidos) {
    const enPiso = S.grado === "facil";
    if (enPiso && S.sesion.yaBajo) S.sesion.enPiso += S.sesion.seguidos;
    if (enPiso && S.sesion.enPiso >= m.errores_seguidos) return piso();
    S.sesion.seguidos = 0; S.sesion.yaBajo = true;
    return terminarItem(false, T.masAyudaInicio, true);
  }
}
/* Ayuda (escalera de la sección 5.4). */
function pedirAyuda() {
  const it = S.item, e = it.esc;
  it.ayuda = Math.min(5, it.ayuda + 1);
  const paso = it.ayuda;
  if (paso === 1) { const c = consignaTexto(); mensaje(T.ayudaPasos[0] + " " + c + (e.pistas ? " " + e.pistas.lista.slice(0, it.pistasVistas).map((x) => x.texto).join(" ") : "")); return; }
  if (paso === 2) { it.modeloVisible = true; it.ocultado = true; if (e.pistas) it.pistasVistas = Math.max(it.pistasVistas, 1); pJuego(false, true); return mensaje(T.ayudaPasos[1]); }
  const objetivo = objetivoPendiente();
  if (!objetivo) return;
  if (paso === 3 || paso === 4) { it.rectAyuda = Motor.region(e, objetivo, paso); pintar(); return mensaje(T.ayudaPasos[paso - 1]); }
  it.rectAyuda = null; it.resaltar = [objetivo.uid || objetivo.id];
  if (e.lugares) it.mostrarLuci = objetivo.id;
  pintar(); mensaje(T.ayudaPasos[4] + " " + T.demo[e.variante]);
  setTimeout(() => { if (S.item === it && !it.terminado) { if (e.lugares) return terminarItem(true, T.demo[e.variante]); hallado(objetivo.uid ? objetivo : { uid: objetivo.id }, T.demo[e.variante]); } }, 2600);
}
function objetivoPendiente() {
  const e = S.item.esc;
  if (e.lugares) return e.lugares.find((l) => l.id === e.objetivo);
  let pend = e.objetivos.filter((u) => !S.item.encontrados.includes(u));
  if (e.regla && S.item.fase === 2) pend = pend.filter((u) => BANCO.objetos[e.elementos.find((x) => x.uid === u).obj].material === e.regla.material);
  return e.elementos.find((x) => x.uid === pend[0]);
}

/* Fin del ítem: registro, M10 y siguiente paso. Sin puntaje, estrellas ni contador (T04). */
function terminarItem(logrado, texto, masAyuda) {
  const it = S.item, e = it.esc; it.terminado = true;
  const reg = { variante: e.variante, grado: e.grado, lamina: e.lamina, acierto: logrado, senuelos: it.senuelos, ayudaMax: it.ayuda,
    conAyuda: Motor.cuentaComoAyuda(it.ayuda, MODULO), ms: Date.now() - it.t0, autocorrecciones: it.autocorrecciones || 0, plan: S.plan || null };
  S.sesion.items.push(reg);
  (S.historial[e.variante] = S.historial[e.variante] || []).push(reg);
  S.recorrido.hechos++; S.recorrido.estrategiasUsadas.add(variante().estrategia);
  avisar({ type: "luci-item", ...reg });
  pintar(); mensaje(texto);
  const aj = Motor.ajusteM10(S.historial[e.variante], S.grado, { m10: MODULO.m10, fijo: S.fijo, yaSubio: S.sesion.subio, erroresSeguidos: masAyuda ? MODULO.m10.errores_seguidos : 0, checkinEstandar: INICIO.checkinEstandar });
  if (aj.subio) S.sesion.subio = true;
  const cambio = aj.grado !== S.grado; S.grado = aj.grado;
  const pasado = (Date.now() - S.sesion.t0) / 60000 > ruta().sesion_min[1];
  const acc = $(".lado");
  const b = document.createElement("button"); b.className = "btn grande"; b.id = "j-seguir"; b.textContent = T.seguir;
  b.onclick = () => {
    if (pasado) return mostrar("mapa", { suave: true });
    if (S.recorrido.hechos >= S.recorrido.total) return mostrar("mapa");
    siguienteItem(masAyuda || (cambio && aj.masAyuda));
  };
  acc && acc.insertBefore(b, $("#msj")); b.focus({ preventScroll: true });
}
/* Piso (M10-6): demostración guiada, se deja la aventura por esta sesión y, si hay profesional, se registra la alerta. */
function piso() {
  const it = S.item, obj = objetivoPendiente(); it.terminado = true;
  if (obj) { it.resaltar = [obj.uid || obj.id]; if (it.esc.lugares) it.mostrarLuci = obj.id; }
  pintar(); mensaje(T.demo[it.esc.variante] + " " + T.pisoTexto);
  avisar({ type: "luci-piso", variante: it.esc.variante, alerta: S.profesional });
  S.sesion.items.push({ variante: it.esc.variante, grado: it.esc.grado, lamina: it.esc.lamina, acierto: false, senuelos: it.senuelos, ayudaMax: 5, conAyuda: true, piso: true });
  const b = document.createElement("button"); b.className = "btn grande"; b.id = "j-seguir"; b.textContent = T.seguir;
  b.onclick = () => mostrar("cierre", { piso: true });
  $(".lado").insertBefore(b, $("#msj")); b.focus({ preventScroll: true });
}

/* ---------- Mapa de Luci (M03-1: se ilumina por participación y nunca se apaga) ---------- */
function pMapa(o = {}) {
  S.mapa.add(S.estacion); S.suave = !!o.suave;
  if (editorial() && S.sobrio) return mostrar("hacer");
  const zonas = ["explorar", "reconocer", "integrar", "transferir"];
  const pos = [[120, 120], [380, 90], [150, 280], [400, 260]];
  const svg = `<svg viewBox="0 0 520 380" role="img" aria-label="${esc(editorial() ? T.mapaAdolescente : T.mapaTitulo)}"><rect width="520" height="380" rx="22" fill="#E0F2EB"/>
    ${zonas.map((z, i) => `<g><circle cx="${pos[i][0]}" cy="${pos[i][1]}" r="62" fill="${S.mapa.has(z) ? "#FFB82E" : "#DAE3E1"}" stroke="#102F54" stroke-width="3"/><text x="${pos[i][0]}" y="${pos[i][1] + 92}" text-anchor="middle" font-size="17" font-weight="800" fill="#102F54" font-family="Nunito,sans-serif">${esc(T.zonas[z])}</text></g>`).join("")}</svg>`;
  const txt = fmt(T.mapaTexto, { zona: T.zonas[S.estacion] });
  $("#app").innerHTML = `<section class="panel cierre mapa"><div class="titulo" style="justify-content:center"><h1 style="flex:0 1 auto">${esc(editorial() ? T.mapaAdolescente : T.mapaTitulo)}</h1>${escuchar(txt)}</div>
    ${svg}<p>${esc(txt)}</p><div class="acciones"><button class="btn grande" id="m-seguir">${esc(T.seguir)}</button></div></section>`;
  $("#m-seguir").onclick = () => mostrar("hacer"); decir(txt);
}
function pHacer() {
  const t = editorial() ? T.hacer.adolescente : T.hacer[S.estacion];
  $("#app").innerHTML = `<section class="panel"><div class="titulo"><h1>${esc(T.hacerTitulo)}</h1>${escuchar(t)}</div><p style="font-size:1.2rem">${esc(t)}</p><p class="small">${esc(T.hacerSeguridad)}</p>
    <div class="acciones"><button class="btn grande" id="h-hecho">${esc(T.loHicimos)}</button><button class="btn sec grande" id="h-saltear">${esc(T.saltear)}</button></div></section>`;
  $("#h-hecho").onclick = () => { avisar({ type: "luci-hacer" }); mostrar("contar"); };
  $("#h-saltear").onclick = () => mostrar("contar"); decir(t);
}
function pContar() {
  if (S.ruta === "3-5") {
    $("#app").innerHTML = `<section class="panel"><div class="titulo"><h1>${esc(T.contarTitulo)}</h1>${escuchar(T.contarAdulto)}</div><p>${esc(T.contarAdulto)}</p>
      <div class="acciones"><button class="btn grande" id="c-seguir">${esc(T.seguir)}</button></div></section>`;
    $("#c-seguir").onclick = () => mostrar("cierre"); decir(T.contarAdulto); return;
  }
  const v = variante(); const estr = [[v.estrategia, T.estrategias[v.estrategia]], ["miro-de-arriba-abajo", T.estrategias["miro-de-arriba-abajo"]], ["pedi-ayuda", T.ayudaUsada]];
  let ayudo = null, como = null;
  $("#app").innerHTML = `<section class="panel"><div class="titulo"><h1>${esc(T.contarTitulo)}</h1>${escuchar(T.contarTitulo + " " + estr.map(([, t]) => t).join(" "))}</div>
    <div class="opciones" style="--min:220px" role="radiogroup" aria-label="${esc(T.contarTitulo)}">${estr.map(([k, t]) => `<button class="opcion" role="radio" aria-checked="false" data-ayudo="${k}"><span class="t">${esc(t)}</span></button>`).join("")}</div>
    <div class="titulo" style="margin-top:16px"><h2>${esc(T.contarComo)}</h2>${escuchar(T.contarComo)}</div>
    <div class="opciones" style="--min:120px" role="radiogroup" aria-label="${esc(T.contarComo)}">${T.como.map((c) => `<button class="opcion centro" role="radio" aria-checked="false" data-como="${c.id}"><span style="font-size:2rem" aria-hidden="true">${c.picto}</span><span class="t">${esc(c.texto)}</span></button>`).join("")}</div>
    <div class="acciones"><button class="btn grande" id="c-seguir">${esc(T.seguir)}</button><button class="btn sec grande" id="c-saltear">${esc(T.saltear)}</button></div></section>`;
  const marcar = (sel, b) => $$(sel).forEach((x) => x.setAttribute("aria-checked", String(x === b)));
  $$("[data-ayudo]").forEach((b) => b.onclick = () => { ayudo = b.dataset.ayudo; marcar("[data-ayudo]", b); });
  $$("[data-como]").forEach((b) => b.onclick = () => { como = b.dataset.como; marcar("[data-como]", b); });
  radios("[data-ayudo]"); radios("[data-como]");
  $("#c-seguir").onclick = () => { if (ayudo || como) avisar({ type: "luci-contar", ayudo, como }); mostrar("cierre"); };
  $("#c-saltear").onclick = () => mostrar("cierre");
}
function pCierre(o = {}) {
  const t1 = o.piso ? T.pisoTexto : S.suave ? T.cierreSuave : T.cierreTitulo;
  const t2 = o.piso ? "" : T.cierreProceso;
  $("#app").innerHTML = `<section class="panel cierre"><div class="titulo" style="justify-content:center"><h1 style="flex:0 1 auto">${esc(t1)}</h1>${escuchar(t1 + " " + t2)}</div><p>${esc(t2)}</p>
    <div class="acciones">${S.suave ? "" : `<button class="btn grande" id="c-otra">${esc(T.otraVez)}</button>`}</div>${pieAdulto()}</section>`;
  const b = $("#c-otra"); if (b) b.onclick = () => (o.piso ? mostrar("adulto") : empezarRecorrido());
  avisar({ type: "luci-fin", piso: !!o.piso, suave: !!S.suave });
  decir(t1 + " " + t2);
}

/* ---------- Lámina para conversar (3–5): no se registra nada ---------- */
function pConversar() {
  const ls = BANCO.laminas.filter((l) => l.variante === "conversar");
  const lam = ls[Math.floor(Math.random() * ls.length)];
  const e = Motor.componer(lam, BANCO, MODULO, {});
  $("#app").innerHTML = `<section class="panel"><div class="titulo"><h1>${esc(T.conversarTitulo)}</h1></div>
    <p class="resumen">${esc(T.conversarGuia)}</p>
    <div class="juego"><div class="escena-marco"><svg id="escena-conv" viewBox="0 0 1200 800" role="img" aria-label="Escena para conversar">${Dibujo.escena(e, { banco: BANCO })}</svg></div>
    <aside class="lado"><ul class="lista pistas">${T.conversarPreguntas.map((q) => `<li>${esc(q)} ${escuchar(q)}</li>`).join("")}</ul>
    <button class="btn grande" id="cv-fin">${esc(T.terminar)}</button></aside></div></section>`;
  $("#cv-fin").onclick = () => mostrar(CON_ADULTO ? "adulto" : "cierre");
}

/* Aviso al portal (si corre dentro de él). Solo datos del juego, nunca datos de la persona. */
function avisar(d) { try { if (EN_MARCO) window.parent.postMessage(d, "*"); } catch (e) { } }
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && EN_MARCO && !e.defaultPrevented && !$(".dialogo")) avisar({ type: "isla-salir-vista-ampliada" }); });
document.addEventListener("visibilitychange", () => { if (document.hidden) try { speechSynthesis.cancel(); } catch (e) { } });

encabezado();
if (!CON_ADULTO) { S.recorrido = { total: ruta().items_por_recorrido, hechos: 0, estrategiasUsadas: new Set() }; S.sesion.t0 = Date.now(); }
mostrar(CON_ADULTO ? "adulto" : "descubrir");
</script>
</body></html>
