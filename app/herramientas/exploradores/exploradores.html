<!doctype html>
<!-- «Los cuatro exploradores»: ocho retos de percepción y procesamiento visual (diez variantes) según la FEC-015 v0.2 de PSP-SR
     (2026-11-15) y las decisiones D1 a D6 de la supervisora. Construida por DEV-IA como herramienta del portal (ADR-009). Corre aislada
     (iframe sin acceso a la app ni a sus datos) y también como archivo suelto para probar con doble clic.
     Pedidos de la supervisora (2026-11-15): letra MAYÚSCULA o minúscula imprenta a elección; consignas breves que se escuchan solo
     al tocar el parlante (nunca audio automático).
     CONTENIDO DE PRUEBA NO VALIDADO: banco, textos breves y parámetros son propuesta (nivel C) a validar por PSP-SR y la supervisora.
     Ilustraciones de relleno con formas simples hechas en código, sin IA generativa y sin imágenes de terceros (REQ-CLI-EXP-00a).
     Ningún modelo de lenguaje interviene: todo se corrige con el banco, en código (T11). -->

<script id="motor">
"use strict";
/* ---------- Motor: lógica pura y determinista (la prueba tests/exploradores.test.js sin navegador) ----------
   Corrección por el banco, rutas, M10 por habilidad, escala de apoyos 0–3 con retiro progresivo, trazo procesado en el dispositivo,
   exposición de 8A y registro: todo en código. Ningún modelo de lenguaje (T11). */
const Motor = (() => {
  const GR = ["facil", "intermedio", "dificil"];
  const VAR = ["objetos", "sombras", "niebla", "jardin", "laberinto", "fabrica", "cofre_cuales", "cofre_orden", "pistas_relampago", "pistas_nuevas"];
  const JUEGO = { objetos: 1, sombras: 2, niebla: 3, jardin: 4, laberinto: 5, fabrica: 6, cofre_cuales: 7, cofre_orden: 7, pistas_relampago: 8, pistas_nuevas: 8 };
  const RUTAS = ["3-5", "6-8", "9-12"];
  const AUTONOMIA = ["autonomo", "con-pista", "con-ayuda-especifica", "con-demostracion"];
  function azar(semilla) {
    let s = (semilla >>> 0) || 0x9e3779b9;
    return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }
  const mezclar = (arr, r) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function mezclarDistinto(arr, r) {
    if (arr.length < 2) return arr.slice();
    for (let t = 0; t < 30; t++) { const a = mezclar(arr, r); if (a.some((x, i) => x !== arr[i])) return a; }
    return arr.slice().reverse();
  }
  const semillaDe = (texto, vuelta = 0) => { let h = 2166136261; for (const c of String(texto) + "#" + vuelta) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const limitar = (x, a, b) => Math.max(a, Math.min(b, Math.round(+x || 0)));

  /* ---------- Rutas (FEC-015 5.12; REQ-CLI-EXP-17) ---------- */
  const variante = (modulo, id) => modulo.estaciones.variantes.find((v) => v.variante === id) || {};
  const param = (modulo, id, grado) => ((variante(modulo, id).grados || {})[grado] || {}).parametros || {};

    bosque: () => `<rect width="1200" height="800" fill="${C.cielo}"/><rect y="420" width="1200" height="380" fill="${C.pasto}"/>${[80, 300, 900, 1120].map((x) => `<g transform="translate(${x - 90} 170) scale(1.8)">${F.arbol({ c: "#5FA77F" })}</g>`).join("")}`,

    sendero: () => `<rect width="1200" height="800" fill="${C.pasto}"/><path d="M0 600 C300 420 700 720 1200 380" fill="none" stroke="${C.tierra}" stroke-width="120"/>`,
    laberinto: () => `<rect width="1200" height="800" fill="${C.pasto}"/>${[0, 1, 2, 3, 4].map((i) => `<rect x="${120 + i * 200}" y="${i % 2 ? 140 : 380}" width="150" height="280" rx="40" fill="#5FA77F" ${T}/>`).join("")}`,
    mapa: () => `<rect width="1200" height="800" fill="${C.crema}"/><path d="M120 640 C320 520 420 700 620 560 S960 420 1080 200" fill="none" stroke="${C.coral}" stroke-width="12" stroke-dasharray="26 20"/>`,

    historia_lugares: () => FONDOS.mapa() + [[200, 560], [380, 640], [560, 560], [720, 470], [880, 380], [1000, 260], [820, 200], [600, 300]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="38" fill="${C.sol}" ${T}/>`).join(""),
    historia_piezas: () => FONDOS.mapa() + [0, 1, 2, 3, 4, 5, 6, 7, 8].map((i) => `<rect x="${250 + (i % 3) * 240}" y="${130 + Math.floor(i / 3) * 190}" width="200" height="160" rx="18" fill="#fff" stroke="${C.coral}" stroke-width="6" stroke-dasharray="18 12"/>`).join(""),

  };

  const lamina = (id, etiqueta = "") => `<svg viewBox="0 0 1200 800" ${etiqueta ? `role="img" aria-label="${etiqueta}"` : 'aria-hidden="true"'} focusable="false">${fondo(id)}</svg>`;
  /* Elemento de una escena: x, y = centro; s = escala; r = giro. */
  const ubicar = (e) => `<g transform="translate(${e.x} ${e.y}) rotate(${+e.r || 0}) scale(${(e.e ? -1 : 1) * (e.s || 1)} ${e.s || 1}) translate(-50 -50)">${caja(e.f, e)}</g>`;
  const parlante = `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9 H8 L13 5 V19 L8 15 H4Z" fill="${INK}"/><path d="M16 9 C18 11 18 13 16 15 M18.5 6.5 C22 10 22 14 18.5 17.5" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/></svg>`;
  const exportar = { F, FONDOS, C, INK, SOMBRA, VB, figura, silueta, transformado, lamina, fondo, ubicar, parlante, caja };
  if (typeof module !== "undefined") module.exports = { Dibujo: exportar };
  return exportar;
})();

const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const S = {

};
const rutaCfg = () => MODULO.rutas[S.ruta];

if (!S.letra) S.letra = MODULO.letra.por_defecto[S.ruta] || "mayuscula";

/* Letra y palabras según la elección MAYÚSCULA o minúscula imprenta. Un valor puede venir del banco como {mayuscula, minuscula}. */

/* ---------- Audio: SOLO cuando se toca el parlante (pedido de la supervisora, 2026-11-15) ----------
   Nunca se reproduce nada solo: ni la historia, ni la consigna, ni las devoluciones. Escuchar es un apoyo de acceso (R11). */
let VOZ = null;
function elegirVoz() { try { const v = speechSynthesis.getVoices(); VOZ = v.find((x) => /^es[-_]AR/i.test(x.lang)) || v.find((x) => /^es[-_](419|US|MX)/i.test(x.lang)) || v.find((x) => /^es/i.test(x.lang)) || null; } catch (e) { } }
if (HAY_VOZ) { elegirVoz(); speechSynthesis.onvoiceschanged = elegirVoz; }
const DICHOS = [];   // solo para la prueba: qué se pidió escuchar (nunca sale del dispositivo)
function decir(t) {
  DICHOS.push(t);
  if (!t || !HAY_VOZ) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = VOZ ? VOZ.lang : "es-AR"; if (VOZ) u.voice = VOZ; u.rate = 0.9; speechSynthesis.speak(u); } catch (e) { }
}
function anunciar(t) { const a = $("#anuncio"); a.textContent = ""; setTimeout(() => { a.textContent = t; }, 30); }
const escuchar = (t, extra = "") => `<button class="parlante" type="button" data-decir="${esc(t)}" aria-label="${esc(N.escuchar)}" ${extra}>${D.parlante}</button>`;

document.addEventListener("click", (e) => {

  if (b.dataset.nombre && S.R && !S.R.terminado) { S.R.audio_objetivo = true; }   // 7A: escuchar el nombre de la imagen (se registra audio_objetivo)
  else if (b.closest(".consigna") && $("#ayuda")) registrarAcceso("escuchar");
});
function msj(t) {
  const m = $("#msj"); if (m) m.textContent = t;
  const p = $("#msj-oir"); if (p) { p.dataset.decir = t; p.hidden = !t; }
  anunciar(t);
}

/* ---------- Encabezado: letra MAYÚSCULA o minúscula y pantalla completa ---------- */
function encabezado() {
  const completa = !EN_MARCO && (document.fullscreenEnabled || document.webkitFullscreenEnabled)
    ? `<button class="btn sec chico" id="completa">${document.fullscreenElement ? "Salir de pantalla completa" : "Pantalla completa"}</button>` : "";
  const elegida = S.letraPendiente || S.letra;
  const letras = `<span class="letras" role="group" aria-label="${esc(T.letraGrupo)}"><button type="button" id="l-may" class="letra-fija" aria-pressed="${elegida === "mayuscula"}" aria-label="${esc(T.letraMayuscula)}">ABC</button><button type="button" id="l-min" class="letra-fija" aria-pressed="${elegida === "minuscula"}" aria-label="${esc(T.letraMinuscula)}">abc</button></span>`;
  $("#hd").innerHTML = (EN_MARCO ? '<span style="margin-right:auto"></span>' : `<span class="marca" aria-hidden="true"></span><span class="nm">${esc(MODULO.nombre)}</span>`)
    + `<span class="rotulo">${esc(T.rotulo)}</span>${letras}${completa}`;
  $("#l-may").onclick = () => cambiarLetra("mayuscula");
  $("#l-min").onclick = () => cambiarLetra("minuscula");
  const c = $("#completa");
  if (c) c.onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement); };
}

/* Cambiar la letra es un apoyo de acceso: no sube el nivel (R11). Con un ejercicio en curso, el cambio rige desde el siguiente
   (REQ-CLI-EXP-22): así un ítem de orientación no se mezcla con uno de detalle. */
function cambiarLetra(l) {
  if ((S.letraPendiente || S.letra) === l) return;
  if (S.R && !S.R.terminado) { S.letraPendiente = l === S.letra ? null : l; registrarAcceso("letra"); encabezado(); msj(T.adulto.letraSiguiente); return; }
  S.letra = l; S.letraPendiente = null; aplicarLetra(); encabezado();
  if (EN_MARCO) parent.postMessage({ type: "exploradores-letra", letra: l }, "*");
}
function aplicarLetraPendiente() {
  if (!S.letraPendiente) return;
  S.letra = S.letraPendiente; S.letraPendiente = null; aplicarLetra(); encabezado();
  if (EN_MARCO) parent.postMessage({ type: "exploradores-letra", letra: S.letra }, "*");
}

/* ---------- Pantalla de la persona adulta ---------- */

      <div><h3><span class="est-chip" style="background:${P[e.color]}">E${e.numero}</span>${esc(e.titulo)}</h3><p><b>${esc(e.juegos)}</b></p><p class="small">${esc(e.habilidades)}</p></div></div>`).join("")}</div>
    <p class="small">${esc(I.nota_personajes)} ${esc(I._estado)}</p></div>`;
}

      return `<button class="opcion" data-ruta="${r}" aria-pressed="${r === S.ruta}" ${ok ? "" : "disabled"}><span class="t">${n}</span>${ok ? `<span class="d">${esc(MODULO.rutas[r].sesion_rango)}</span>` : `<span class="d">No disponible</span>`}</button>`; }).join("")}</div>

      ${VARIANTES.map((v) => { const gs = disp(v.variante); return `<tr><td>${esc(v.lugar)}</td><td>${esc(v.titulo)}</td><td>${esc(NOMBRE_EST[v.estacion])}</td><td>${esc(v.habilidad_referencia)}</td><td>${gs.length
        ? `<select data-grado-de="${v.variante}" aria-label="Grado de partida de ${esc(v.titulo)}">${GRADOS.filter(([g]) => gs.includes(g)).map(([g, n]) => `<option value="${g}" ${gradoInicial(v.variante) === g ? "selected" : ""}>${n}</option>`).join("")}</select>`
        : `<span class="small">No se publica para esta edad</span>`}</td></tr>`; }).join("")}</tbody></table></div>
      <p class="small">${esc(A.libre)}</p></div>

      <label><input type="checkbox" id="a-color" ${S.evitarColor ? "checked" : ""}> ${esc(A.evitarColor)}</label>
      <label><input type="checkbox" id="a-nombres" ${S.audioNombres ? "checked" : ""}> ${esc(A.audioNombres)}</label></div>

      `<button class="opcion" data-apoyo="${n}" aria-pressed="${n === S.apoyoInicial}"><span class="t">Nivel ${n}</span><span class="d">${esc(MODULO.apoyos_escala.niveles[n])}</span></button>`).join("")}</div>

  const r = $("#a-registro"); if (r) r.onclick = verRegistro;
  $("#a-seguir").onclick = () => {
    S.fijo = $("#a-fijo").checked; S.sinTrazoFino = $("#a-trazo").checked; S.sinExposicionBreve = $("#a-expo").checked; S.evitarColor = $("#a-color").checked; S.audioNombres = $("#a-nombres").checked;

/* ---------- Descubrir: la historia (la primera vez y después a pedido). Láminas fijas; el audio solo con el parlante. ---------- */
function historia(despues) {
  const L2 = BANCO.historia.laminas; let i = 0;
  const pintar = () => {
    const l = L2[i], ult = i === L2.length - 1;
    const toda = L2.map((x) => x.frases.join(" ")).join(" ");
    $("#app").innerHTML = `<section class="panel cierre nino" aria-labelledby="h-t"><h1 id="h-t">${esc(N.historiaTitulo)}</h1>
      <div class="acciones" style="justify-content:center;margin:0 0 8px"><button class="btn suave" id="h-toda" data-decir="${esc(toda)}">${D.parlante} ${esc(N.escucharHistoria)}</button></div>
      <div class="lamina">${D.lamina(l.lamina, l.descripcion)}</div>
      <div id="h-texto">${l.frases.map((f) => `<div class="consigna" style="justify-content:center"><p style="flex:0 1 auto">${esc(f)}</p>${escuchar(f)}</div>`).join("")}</div>
      <p class="small">${i + 1} / ${L2.length}</p>
      ${ult && S.ruta === "3-5" ? `<p class="guia adulto-txt">${esc(BANCO.historia.guia_adulto_3_5)}</p>` : ""}
      <div class="acciones">${i ? `<button class="btn sec" id="h-antes">${esc(N.anterior)}</button>` : ""}<button class="btn" id="${ult ? "h-fin" : "h-sig"}">${esc(ult ? N.alMapa : N.siguiente)}</button></div></section>`;
    const a = $("#h-antes"); if (a) a.onclick = () => { i -= 1; pintar(); };
    const s = $("#h-sig"); if (s) s.onclick = () => { i += 1; pintar(); $("#h-sig, #h-fin").focus(); };
    const f = $("#h-fin"); if (f) f.onclick = () => { S.historiaVista = true; if (EN_MARCO) parent.postMessage({ type: "exploradores-historia" }, "*"); despues(); };
  };
  pintar();
}

/* ---------- Mapa del niño: lugares con nombres de acción, nunca Estación ni grado (REQ-CLI-EXP-03). Todos abiertos (REQ-02). ---------- */
const LUGARES = () => { const out = []; for (const v of VARIANTES) { const id = v.lugar_id || v.juego; if (!out.some((x) => x.juego === id)) out.push({ juego: id, lugar: v.lugar, lamina: v.lamina, personaje: v.personaje }); } return out; };
function mapa() {

/* ---------- Ciclo de ítems, apoyos y registro ---------- */
function siguienteItem() {
  aplicarLetraPendiente();
  const lista = Motor.itemsDe(BANCO, S.variante, S.grado, S.ruta, { lee: lee(), evitarColor: S.evitarColor, letra: S.letra });
  const k = S.variante + "/" + S.grado + "/" + S.ruta + "/" + S.letra;
  let i = S.idx[k] || 0;
  let apoyo = S.variante in S.apoyoSig ? S.apoyoSig[S.variante] : S.apoyoInicial;
  // REQ-CLI-EXP-18: el mismo tipo de error 3 veces en el grado → el próximo ítem trabaja ese rasgo con apoyo de nivel 1.
  const rasgo = S.rasgoSig[S.variante]; let porRasgo = false;
  if (rasgo) { const j = Motor.itemPorRasgo(lista, rasgo, i % lista.length); if (j >= 0) { i = j + Math.floor(i / lista.length) * lista.length; porRasgo = true; } apoyo = Math.max(apoyo, 1); delete S.rasgoSig[S.variante]; }
  S.idx[k] = i + 1;
  S.item = lista[i % lista.length];
  S.R = { t0: Date.now(), errores: 0, intentos: 0, tipos: [], apoyos: [], apoyo_max: 0, apoyo_inicial: apoyo, nivelAyuda: 0, audio_objetivo: false, autocorreccion: false,
    seguidos: 0, modalidades: new Set(), extra: {}, terminado: false, porRasgo, tipo_letra: S.item.letra_forma || S.letra, con_letras: !!S.item.letra_forma };
  if (JUEGOS[S.variante].render(S.item) !== "espera") aplicarApoyoInicial();
}
function aplicarApoyoInicial() {
  const n = S.R.apoyo_inicial;
  for (let k = 1; k <= n; k++) usarAyuda(k, true);
  if (!n && S.destacar[S.variante]) { const b = $("#ayuda"); if (b) b.classList.add("ofrecida"); }
}
/* Marco de un reto: consigna breve con su parlante, cuerpo y columna con ayuda y devolución. */
function marcoJuego(consigna, cuerpo, lado = "") {
  // En Fácil e Intermedio el botón de ayuda está a la vista; en Difícil, disponible y no destacado (FEC-015 5.3).
  const clase = S.grado === "dificil" ? "btn sec chico" : "btn suave";
  $("#app").innerHTML = `<section class="panel nino" data-variante="${S.variante}"><div class="consigna"><p id="consigna">${esc(consigna)}</p>${escuchar(consigna)}</div>
    <div class="juego"><div id="cuerpo">${cuerpo}</div><div class="lado">${lado}<button class="${clase}" id="ayuda">${esc(N.ayuda)}</button>
    <div class="msj-caja"><div class="msj" id="msj" aria-live="polite"></div>${escuchar("", 'id="msj-oir" hidden')}</div>
    <button class="btn sec chico" id="j-mapa">${esc(N.volverMapa)}</button></div></div></section>`;
  $("#ayuda").onclick = () => usarAyuda(Math.min(3, S.R.nivelAyuda + 1));
  $("#j-mapa").onclick = () => { if (S.R && !S.R.terminado) S.R.abandonado = true; mapa(); };
}
function cambiarConsigna(t) { $("#consigna").textContent = t; $(".consigna [data-decir]").dataset.decir = t; }
function usarAyuda(nivel, inicial) {
  const R = S.R; if (!R || R.terminado || nivel < 1 || nivel > 3) return;
  R.nivelAyuda = Math.max(R.nivelAyuda, nivel); R.apoyo_max = Math.max(R.apoyo_max, nivel); R.seguidos = 0;
  const nombre = JUEGOS[S.variante].ayuda(nivel, S.item);
  R.apoyos.push((inicial ? "inicial:" : "") + nivel + ":" + (nombre || "ayuda"));
  const b = $("#ayuda"); if (b) { b.classList.remove("ofrecida"); if (R.nivelAyuda >= 3) b.disabled = true; }
}
/* Error: devolución neutra con pista (M18-2) y, desde el primer error, la ayuda de nivel 1 ofrecida (REQ-CLI-EXP-06). */
function error(t, tipo, cuantos = 1) {
  const R = S.R; if (!R || R.terminado) return;
  R.errores += cuantos; R.seguidos += 1; if (tipo) R.tipos.push(tipo);
  const b = $("#ayuda");
  if (b && R.nivelAyuda < 3) { b.classList.add("ofrecida"); msj(t + " " + N.ofrecerAyuda); } else msj(t);
}
function finItem(extra = {}) {
  const R = S.R, v = variante(), id = S.variante;
  if (!R || R.terminado) return; R.terminado = true;
  const mods = [...R.modalidades], modalidad = !mods.length ? "tocar" : mods.length > 1 ? "mixta" : mods[0];
  const reg = Motor.registro({ variante: id, juego: v.juego, estacion: v.estacion, grado: S.grado, item: S.item.id,
    habilidad: Motor.habilidadDe(MODULO, id, S.item, { sinTrazoFino: S.sinTrazoFino }), resultado: extra.resultado, errores: R.errores, intentos: R.intentos,
    tipos_error: R.tipos, apoyos: R.apoyos, apoyo_inicial: R.apoyo_inicial, apoyo_max: R.apoyo_max, modalidad, autocorreccion: R.autocorreccion, ms: Date.now() - R.t0,
    tipo_letra: R.tipo_letra, con_letras: R.con_letras,
    extra: { ...R.extra, ...(extra.extra || {}), audio_objetivo: id === "cofre_cuales" ? R.audio_objetivo : undefined } });
  const ok = Motor.acierto(id, reg, MODULO, S.ruta);
  S.registros.push(reg);
  if (EN_MARCO) parent.postMessage({ type: "exploradores-item", acierto: ok, ...reg }, "*");
  const sig = Motor.siguienteApoyo(reg.apoyo_max); S.apoyoSig[id] = sig.nivel; S.destacar[id] = sig.destacar;
  const conAyuda = !Motor.sinAyuda(reg);
  S.sesion.seguidos = ok ? 0 : S.sesion.seguidos + 1;
  const opc = { m10: MODULO.m10, fijo: S.fijo, yaSubio: S.sesion.subio, erroresSeguidos: S.sesion.seguidos, grados: Motor.gradosDe(MODULO, S.ruta, id) };
  const key = id + "/" + reg.habilidad, hh = S.hist[key] || (S.hist[key] = []); hh.push({ acierto: ok, conAyuda });
  const aj = Motor.ajusteM10(hh, S.grado, opc);
  const ckey = id + "/" + S.grado, cuenta = S.cuentaErr[ckey] || (S.cuentaErr[ckey] = {});
  const rep = Motor.tipoRepetido(cuenta, reg.tipos_error, MODULO.error_repetido_umbral || 3);
  if (rep) S.rasgoSig[id] = rep;
  if (aj.grado !== S.grado) { S.grado = aj.grado; S.gradoDe[id] = aj.grado; if (aj.subio) S.sesion.subio = true; S.sesion.seguidos = 0; S.cuentaErr[ckey] = {}; }
  if (aj.masAyuda) { S.apoyoSig[id] = Math.max(S.apoyoSig[id], 2); if (aj.grado === opc.grados[0]) S.sesion.enPiso += 1; S.sesion.seguidos = 0; }
  S.sesion.items += 1;

  if (piso && EN_MARCO) parent.postMessage({ type: "exploradores-piso" }, "*");
  const tiempo = Date.now() - S.t0Sesion >= rutaCfg().sesion_min * 60000;   // T08: cierre suave por tiempo de sesión
  const fin = piso || tiempo || S.sesion.items >= (v.items_por_ronda || rutaCfg().items_por_ronda);
  const lado = $(".lado"), ay = $("#ayuda"); if (ay) ay.remove();
  lado.insertAdjacentHTML("afterbegin", `<button class="btn" id="j-seguir">${esc(N.seguir)}</button>`);
  msj(extra.devolucion || S.item.ok || BANCO.devoluciones.acierto[id]);
  $("#j-seguir").focus();
  $("#j-seguir").onclick = () => (fin ? cierre(piso ? "piso" : tiempo ? "tiempo" : "ronda") : siguienteItem());

/* ---------- Tocar y ubicar, con arrastre opcional (WCAG 2.5.7: siempre hay alternativa sin arrastre) ----------
   Se toca una ficha y después el destino; o se arrastra la ficha hasta el destino. Los dos caminos llaman a la misma función. */

    marcoJuego(it.consigna, `${it.regla ? `<div class="consigna" style="justify-content:center"><p id="regla" style="flex:0 1 auto">${esc(it.regla)}</p>${escuchar(it.regla)}</div>` : ""}${collar}<div class="sendero" id="sendero"></div><div id="resp"></div>`);
    this.pista(it);
  },
  pista(it) {
    const R = S.R, L2 = R.local, p = it.pistas[L2.k]; L2.primera = true; L2.t0 = performance.now(); clearTimeout(L2.timer);
    const sendero = $("#sendero");
    if (it.modo === "grupo") {
      sendero.innerHTML = p.opciones.map((o, i) => `<button type="button" class="ficha" data-op="${i}" aria-label="${esc(nombre(o))}">${D.figura(o.f, o)}</button>`).join("");
      $("#resp").innerHTML = "";
      $$("#sendero [data-op]").forEach((b) => b.onclick = () => this.responder(it, +b.dataset.op === p.correcta, "falsa-alarma"));
      return;
    }
    sendero.innerHTML = `<div class="ficha" id="pista-vista" role="img" aria-label="${esc(nombre(p.o))}">${D.figura(p.o.f, p.o)}</div>`;
    $("#resp").innerHTML = it.modo === "una"
      ? `<div class="dos-botones"><button class="btn" data-r="si">${esc(N.esIgual)}</button><button class="btn sec" data-r="no">${esc(N.noEsIgual)}</button></div>`
      : `<div class="dos-botones">${["a", "b"].map((m) => `<button class="btn ${m === "b" ? "sec" : ""}" data-r="${m}">${esc(N.guardarEn)} ${esc(it.mochilas[m].txt)}</button>`).join("")}</div>
         <div class="acciones" style="justify-content:center"><button class="btn sec chico" id="mirala" hidden>${esc(N.mirala)}</button></div>`;
    $$("#resp [data-r]").forEach((b) => b.onclick = () => this.responder(it, it.modo === "una" ? (b.dataset.r === "si") === p.igual : b.dataset.r === p.mochila, it.modo === "una" ? (p.igual ? "omision" : "falsa-alarma") : "rasgo"));
    if (L2.breve) this.exponer();
  },
  exponer() {
    const L2 = S.R.local, v = $("#pista-vista"); if (!v) return;
    v.classList.remove("tapada"); v.firstElementChild && (v.firstElementChild.style.visibility = "visible");
    L2.timer = setTimeout(() => { if (S.R.terminado) return; const w = $("#pista-vista"); if (!w) return; w.classList.add("tapada"); w.firstElementChild.style.visibility = "hidden"; const m = $("#mirala"); if (m) m.hidden = false; }, L2.ms);
    const m = $("#mirala"); if (m) { m.hidden = true; m.onclick = () => { usarApoyoMirala(); this.exponer(); }; }
  },
  responder(it, bien, tipo) {
    const R = S.R, L2 = R.local; if (R.terminado) return; R.intentos += 1;
    if (L2.primera) { L2.tiempos.push(Math.round(performance.now() - L2.t0)); if (bien) L2.bien += 1; L2.primera = false; }
    if (!bien) { error(errorDe("pistas_relampago", tipo), tipo); if (L2.breve) this.exponer(); return; }
    clearTimeout(L2.timer); msj(""); L2.k += 1;
    if (L2.k < it.pistas.length) return setTimeout(() => { if (!R.terminado) this.pista(it); }, MODULO.exposicion_8a.pausa_ms);
    const precision = L2.bien / it.pistas.length;
    R.extra.precision = precision; R.extra.tiempo_respuesta_mediana_ms = Motor.mediana(L2.tiempos);
    if (L2.breve) { S.expoAcorto = S.expoAcorto || {}; const sig = Motor.exposicionSiguiente(S.expo[S.grado], precision, MODULO.exposicion_8a, { ruta: S.ruta, yaAcorto: !!S.expoAcorto[S.grado] });
      if (sig.acorto) S.expoAcorto[S.grado] = true; S.expo[S.grado] = sig; }
    $("#sendero").innerHTML = `<div class="lamina chica" style="margin:0">${D.lamina("bosque", N.pausaBosque)}</div>`; $("#resp").innerHTML = "";
    finItem({ devolucion: DEV.acierto.pistas_relampago });
  },
  ayuda(n, it) {
    if (n === 1) { marcar($(".collar") || $(".cajas")); msj(pista1("pistas_relampago")); if (S.R.local.breve) this.exponer(); return "mirar-otra-vez"; }
    const p = it.pistas[S.R.local.k];
    if (n === 2) { if (it.modo === "grupo") { const b = $$("#sendero [data-op]").find((x) => +x.dataset.op !== p.correcta); if (b) b.disabled = true; } msj(BANCO.ayudas.pistas_relampago[2]); return "un-detalle"; }
    msj(N.demostracion); return "demostracion";
  }
};
function usarApoyoMirala() { const R = S.R; if (!R || R.terminado) return; R.apoyo_max = Math.max(R.apoyo_max, 1); if (R.apoyos.length < 20) R.apoyos.push("1:mirala-otra-vez"); }

/* ===== Juego 8B · «Pistas nuevas» · transferencia (E4) ===== */
JUEGOS.pistas_nuevas = {
  render(it) {
    if (it.tipo === "escena" || it.tipo === "campamento") return busqueda("pistas_nuevas", it);
    // Difícil: plan previo (opciones cerradas), recordar el orden de las pistas y llevar a Roco; después «¿Cumple todas las pistas?».
    S.R.local = {};
    marcoJuego(N.elegiComo, `<div class="opciones" style="--min:200px" id="plan">${BANCO.contar_estrategias_8b.map((o) => `<button class="opcion" data-e="${o.id}"><span class="t">${esc(o.txt)}</span></button>`).join("")}</div>`);
    $$("#plan [data-e]").forEach((b) => b.onclick = () => {
      S.R.extra.estrategia = b.dataset.e;
      mirar(it, it.orden.map((i) => it.objetos[i]), () => { cambiarConsigna(it.consigna); aplicarApoyoInicial(); this.recorrido(it); }, false);
    });
    return "espera";
  },
  recorrido(it) {
    const R = S.R;
    $("#cuerpo").innerHTML = `<div id="tab"></div>${flechasHTML(it, "absoluto")}<p class="guia" id="juntadas"></p>
      <div class="acciones" style="justify-content:center"><button class="btn" id="listo">${esc(N.listo)}</button><button class="btn sec" id="de-nuevo">${esc(N.empezarDeNuevo)}</button></div>`;
    const t = tablero(it, (st) => { $("#juntadas").textContent = N.juntaste + " " + st.juntados.map((i) => BANCO.nombres[it.objetos[i].f]).join(", "); });
    R.local.t = t; t.pintar(); $("#juntadas").textContent = N.juntaste + " —";
    const reiniciar = () => { const st = R.local.t.st; st.x = it.roco.x; st.y = it.roco.y; st.juntados = []; st.flecha = null; t.pintar(); $("#juntadas").textContent = N.juntaste + " —"; };
    $("#de-nuevo").onclick = () => { const st = R.local.t.st; if (JSON.stringify(st.juntados) !== JSON.stringify(it.orden)) R.local.revisoConError = R.local.revisoConError || st.juntados.length > 0; reiniciar(); };
    $("#listo").onclick = () => {
      if (R.terminado) return;
      $("#resp8b") && $("#resp8b").remove();
      $("#cuerpo").insertAdjacentHTML("beforeend", `<div id="resp8b" class="guia" style="margin-top:12px"><div class="consigna"><p>${esc(N.cumple)}</p>${escuchar(N.cumple)}</div><div class="dos-botones"><button class="btn" id="si">${esc(N.si)}</button><button class="btn sec" id="revisar">${esc(N.revisar)}</button></div></div>`);
      $("#revisar").onclick = () => { const st = R.local.t.st; if (JSON.stringify(st.juntados) !== JSON.stringify(it.orden)) R.local.revisoConError = true; $("#resp8b").remove(); reiniciar(); };
      $("#si").onclick = () => { R.intentos += 1; const st = R.local.t.st; $("#resp8b").remove();
        if (JSON.stringify(st.juntados) === JSON.stringify(it.orden)) { R.autocorreccion = !!R.local.revisoConError; return finItem(); }
        const tipo = st.juntados.length < it.orden.length ? "omision" : "transposicion"; error(errorDe("pistas_nuevas", tipo), tipo); reiniciar(); };
    };
  },
  ayuda(n, it) {
    if (it.tipo !== "recorrido") return ayudaBusqueda("pistas_nuevas", n, it);
    if (n === 1) { msj(pista1("pistas_nuevas")); return "recordar-la-estrategia"; }
    if (n === 2) { $("#juntadas").insertAdjacentHTML("afterend", `<div class="fila-obj" id="recordatorio">${it.orden.map((i) => fichaFija(it.objetos[i])).join("")}</div>`); msj(BANCO.ayudas.pistas_nuevas.recorrido2); return "ver-las-pistas-otra-vez"; }
    const st = S.R.local.t.st, prox = it.orden[st.juntados.length]; if (prox == null) return "ayuda";
    const c = caminoMasCorto(it, st, it.objetos[prox])[0]; if (c) S.R.local.t.mover(c.d);
    msj(N.demostracion); return "demostracion-de-un-paso";
  }
};
