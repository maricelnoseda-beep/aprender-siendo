# Configuración de funciones (Supabase CLI). Solo el aviso de Mercado Pago se
# expone sin sesión; su autenticidad la verifica la firma.
[functions.webhook-mercadopago]
verify_jwt = false

[functions.suscripcion-iniciar]
verify_jwt = true

[functions.suscripcion-cancelar]
verify_jwt = true

[functions.suscripcion-arrepentimiento]
verify_jwt = true

[functions.suscripcion-estado]
verify_jwt = true
