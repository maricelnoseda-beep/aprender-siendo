<!doctype html>
<!-- Isla de Juegos: juego aportado por la responsable del proyecto (2026-11-01), incorporado como herramienta.
     Cambios de DEV-IA: aviso del resultado de cada ronda al marco de Aprender Siendo (postMessage) y texto de datos actualizado.
     REVISAR (PSP-SR): consignas, niveles, regla adaptativa (3 aciertos / 3 errores) y la sección "Fundamentos". --><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Isla de Juegos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: un mapa de cinco islas (una por área), sesiones cortas de 6 juegos, un solo foco por pantalla. */
:root{
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Lexend','Segoe UI',system-ui,sans-serif;
  --bg:#EAF3F3; --surface:#FFFFFF; --ink:#14303A; --ink-2:#466470; --line:#C5D9DC;
  --brand:#1B7F86; --on-brand:#FFFFFF; --sun:#F2B33D; --ok:#23895F; --try:#C9791B;
  --c-num:#D9732A; --c-ate:#2B7BBF; --c-mem:#7A55C9; --c-eje:#1E9A6E; --c-len:#D14D7B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E2227; --surface:#16323A; --ink:#E4F1F1; --ink-2:#9BB8BF; --line:#2C4B54;
    --brand:#4DC0C7; --on-brand:#06252A; --sun:#F5C55E; --ok:#4CC595; --try:#F0A94A;
    --c-num:#F29A55; --c-ate:#5FA8E6; --c-mem:#A58BE8; --c-eje:#4CC49A; --c-len:#F084A8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E2227; --surface:#16323A; --ink:#E4F1F1; --ink-2:#9BB8BF; --line:#2C4B54;
  --brand:#4DC0C7; --on-brand:#06252A; --sun:#F5C55E; --ok:#4CC595; --try:#F0A94A;
  --c-num:#F29A55; --c-ate:#5FA8E6; --c-mem:#A58BE8; --c-eje:#4CC49A; --c-len:#F084A8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;margin:0;
  padding-block:14px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.hc{--line:var(--ink-2);--ink-2:var(--ink)}
body.scanning{padding-bottom:120px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto}
.ico{width:1.6em;height:1.6em;flex:none}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.me{display:flex;align-items:center;gap:12px;min-width:0}
.av{font-size:2.6rem;line-height:1;background:var(--surface);border:3px solid var(--line);border-radius:50%;width:68px;height:68px;display:grid;place-items:center;flex:none}
.hi{font-family:var(--display);font-size:1.7rem;font-weight:600;line-height:1.1}
.sub{color:var(--ink-2);font-size:.95rem}
.icon-btn{width:64px;height:64px;border-radius:20px;border:3px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.btn{min-height:68px;border-radius:22px;border:3px solid var(--brand);background:var(--brand);color:var(--on-brand);font-family:var(--display);font-weight:600;font-size:1.4rem;padding:10px 22px;display:inline-flex;align-items:center;justify-content:center;gap:12px;width:100%}
.btn.alt{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.small{min-height:52px;font-size:1.05rem;width:auto}
.btn:active,.opt:active,.cell:active{transform:scale(.97)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin:18px 0}
.isle{--c:var(--c-num);text-align:left;border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:176px;
  background:color-mix(in srgb,var(--c) 13%,var(--surface));border:3px solid color-mix(in srgb,var(--c) 55%,var(--line))}
.isle .ib{width:64px;height:64px;border-radius:50%;background:var(--c);color:var(--surface);display:grid;place-items:center}
.isle .ib .ico{width:36px;height:36px}
.isle .nm2{font-family:var(--display);font-size:1.3rem;font-weight:600;line-height:1.1}
.isle .ds{font-size:.85rem;color:var(--ink-2)}
.pips{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.pips i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--c)}
.lv{font-size:.8rem;font-weight:600;color:var(--ink-2)}
.garden{background:var(--surface);border:3px solid var(--line);border-radius:28px;padding:16px}
.garden h2{font-family:var(--display);font-size:1.3rem;margin:0 0 8px}
.flowers{display:flex;flex-wrap:wrap;gap:2px}
.flowers svg{width:40px;height:40px}
.top{display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:10px;flex:1;justify-content:center}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--c)} .dots i.now{outline:4px solid var(--c);outline-offset:2px}
.stage{--c:var(--c-num);margin-top:12px;background:var(--surface);border:3px solid var(--line);border-radius:28px;padding:16px}
.chip{font-size:.8rem;font-weight:600;color:var(--c);text-align:center}
.prompt{font-family:var(--display);font-size:1.7rem;font-weight:600;text-align:center;margin:6px 0 10px;text-wrap:balance;line-height:1.2}
.visual{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;min-height:90px;padding:6px 0 12px}
.opts{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:14px}
.opts:empty{display:none}
.opt{min-height:100px;border-radius:24px;border:3px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;position:relative;min-width:0}
body.big .opt{min-height:150px}
body.hc .opt{border-width:5px}
.opt:hover{border-color:var(--c)}
.opt .nm{font-family:var(--display);font-size:2.6rem;font-weight:600}
.opt .pic{font-size:3.2rem;line-height:1}
.opt .wd{font-size:1.05rem;font-weight:500}
.opt .tx{font-family:var(--display);font-size:1.6rem;font-weight:600}
.opt svg.field,.opt svg.nline{width:100%;max-width:240px}
.opt svg.dice{width:96px;height:96px}
.opt svg.shp{width:64px;height:64px}
.opt.ok,.opt.picked{background:color-mix(in srgb,var(--ok) 22%,var(--surface));border-color:var(--ok)}
.opt.try{opacity:.4;animation:nudge .4s}
.opt.gone{visibility:hidden}
.opt.hint,.cell.hint{animation:glow 1s ease-in-out infinite;border-color:var(--sun)}
.scan{outline:6px solid var(--sun)!important;outline-offset:3px}
.ord{position:absolute;top:6px;left:8px;background:var(--ok);color:var(--surface);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:.9rem;font-weight:600}
.fb{min-height:54px;margin-top:12px;text-align:center;font-weight:600;font-size:1.15rem;display:flex;align-items:center;justify-content:center}
.fb.ok{color:var(--ok)} .fb.soft{color:var(--try)}
.hint-box{width:100%;text-align:center;padding:10px;border-radius:18px;background:color-mix(in srgb,var(--sun) 22%,var(--surface))}
.grp{display:inline-flex;flex-wrap:wrap;gap:2px;justify-content:center;font-size:1.9rem;max-width:230px;padding:6px 10px;border-radius:18px;border:2px dashed var(--line)}
.grp .it.x{opacity:.3;text-decoration:line-through}
.op{font-family:var(--display);font-size:2.4rem;font-weight:600}
.cntgrid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:420px}
.cnt{font-size:2.4rem;line-height:1;border:3px solid transparent;border-radius:16px;background:none;padding:4px 6px}
.cnt.counted{background:color-mix(in srgb,var(--c) 22%,var(--surface));border-color:var(--c)}
.ten{display:inline-grid;grid-template-rows:repeat(10,7px);gap:1px;width:16px;margin:0 3px}
.ten i{background:var(--c);border-radius:2px}
.one{display:inline-block;width:16px;height:16px;background:var(--c);border-radius:3px;margin:2px}
.blocks{display:flex;align-items:flex-end;flex-wrap:wrap;gap:4px;justify-content:center}
.cgrid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:10px;width:100%;max-width:420px;margin:0 auto}
.cell{aspect-ratio:1;border:3px solid var(--line);background:var(--surface);border-radius:18px;display:grid;place-items:center;padding:6px;min-width:0}
.cell svg{width:70%;height:70%}
.cell.found{background:color-mix(in srgb,var(--ok) 25%,var(--surface));border-color:var(--ok)}
.shake{animation:nudge .4s}
.sample{width:92px;height:92px;border-radius:50%;border:4px solid var(--c);display:grid;place-items:center;margin:0 auto 12px}
.sample svg{width:60%;height:60%}
.tgts{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:360px;width:100%;margin:0 auto}
.rule{font-family:var(--display);font-size:1.5rem;font-weight:600;text-align:center;padding:8px 18px;border-radius:18px;background:color-mix(in srgb,var(--c) 18%,var(--surface));margin:0 auto 12px;width:fit-content}
.rule.flip{animation:glow .8s 2}
.blk{background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.blk.lit{background:var(--c);transform:scale(1.05)}
.blk[data-n]::after{content:attr(data-n);font-family:var(--display);font-size:1.6rem;font-weight:600}
.card{background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.card .face{display:none;font-size:2.6rem}
.card.up .face,.card.ok .face{display:block}
.card.up .back,.card.ok .back{display:none}
.card .back .ico{width:50%;height:50%;color:var(--c)}
.card.ok{background:color-mix(in srgb,var(--ok) 25%,var(--surface));border-color:var(--ok)}
.stim{width:min(52vw,210px);aspect-ratio:1;border-radius:50%;border:4px dashed var(--line);display:grid;place-items:center;font-size:5rem;margin:6px auto}
.stim.on{border-style:solid;border-color:var(--c)}
.stim.hit{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--surface))}
.stim.miss{border-color:var(--try)}
.tapbtn{min-height:100px;font-size:1.8rem}
.syl{display:inline-block;padding:4px 12px;margin:2px;border-radius:14px;background:var(--surface);border:2px solid var(--c);font-weight:600}
.big-letter{font-family:var(--display);font-size:4.4rem;font-weight:600;width:110px;height:110px;border-radius:26px;display:grid;place-items:center;border:4px solid var(--c);color:var(--c)}
.big-pic{font-size:5rem;line-height:1}
.bubble{width:150px;height:150px;border-radius:50%;background:color-mix(in srgb,var(--brand) 30%,var(--surface));border:4px solid var(--brand);margin:16px auto;display:grid;place-items:center;font-family:var(--display);font-size:1.3rem}
.bubble.on{animation:breathe 8s ease-in-out infinite}
.stars{display:flex;justify-content:center;gap:8px;margin:8px 0}
.stars svg{width:56px;height:56px}
.center{text-align:center}
.stack{display:grid;gap:12px;margin-top:14px}
.avs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}
.avs button{font-size:3.6rem;border-radius:26px;border:3px solid var(--line);background:var(--surface);aspect-ratio:1;min-height:90px}
.panel{background:var(--surface);border:3px solid var(--line);border-radius:28px;padding:16px;margin-top:14px}
.panel h2{font-family:var(--display);font-size:1.3rem;margin:0 0 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:2px solid var(--line)}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--ink-2);font-size:.85rem}
.sw{width:68px;height:38px;border-radius:20px;border:0;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{left:34px}
.seg{display:flex;gap:6px}
.seg button{min-height:48px;padding:6px 12px;border-radius:14px;border:3px solid var(--line);background:var(--surface)}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 20%,var(--surface))}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
details{margin-top:6px} summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
details p,details li{font-size:.92rem;color:var(--ink-2)}
.note{font-size:.88rem;color:var(--ink-2)}
.scanbar{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:3px solid var(--line);padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
body.scanning .scanbar{display:block}
@keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes glow{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--sun) 45%,transparent)}}
@keyframes breathe{0%,100%{transform:scale(.8)}50%{transform:scale(1.25)}}
body.calm *{animation:none!important;transition:none!important}
body.calm .bubble.on{animation:breathe 8s ease-in-out infinite!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bubble.on{animation:breathe 8s ease-in-out infinite!important}}
@media (max-width:420px){.prompt{font-size:1.45rem}.opt .nm{font-size:2.2rem}}
</style>
</head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">

<script>
(function(){'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const ico=(id)=>`<svg class="ico" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-${id}"/></svg>`;

const KEY='isla-de-juegos-v1';
const AREAS={
  num:{n:'Números',d:'Cantidades y cuentas',i:'num'},
  ate:{n:'Atención',d:'Mirar, buscar, esperar',i:'ate'},
  mem:{n:'Memoria',d:'Recordar y repetir',i:'mem'},
  eje:{n:'Mi cabeza al mando',d:'Frenar, cambiar, ordenar',i:'eje'},
  len:{n:'Palabras',d:'Sonidos y significados',i:'len'}
};
const defaults=()=>{const p={};Object.keys(AREAS).forEach(k=>p[k]={level:1,streak:0,miss:0,played:0,right:0,tried:0});
  return {avatar:null,last:null,sessions:0,flowers:[],prefs:{sound:true,voice:true,calm:false,scan:false,scanMs:1800,hc:false,big:false},prog:p}};
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.prog){const d=defaults();Object.assign(d,r);d.prefs=Object.assign(defaults().prefs,r.prefs||{});Object.keys(AREAS).forEach(k=>{d.prog[k]=Object.assign(defaults().prog[k],(r.prog||{})[k]||{})});return d}}catch(e){}return defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* Sonido suave (sin sonidos bruscos) */
let AC=null;
function tone(seq){if(!S.prefs.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;
  seq.forEach(([f,d,dl])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t0+dl);g.gain.linearRampToValueAtTime(.1,t0+dl+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dl+d);
    o.connect(g);g.connect(AC.destination);o.start(t0+dl);o.stop(t0+dl+d+.05)})}catch(e){}}
const SND={ok:()=>tone([[523,.18,0],[659,.18,.12],[784,.3,.24]]),soft:()=>tone([[392,.25,0],[330,.3,.14]]),
  tap:()=>tone([[620,.08,0]]),done:()=>tone([[523,.2,0],[659,.2,.15],[784,.2,.3],[1047,.4,.45]])};

/* Voz: lee cada consigna para quienes no leen o leen con dificultad */
let VOICE=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();VOICE=v.find(x=>/^es[-_]AR/i.test(x.lang))||v.find(x=>/^es[-_](419|MX|US)/i.test(x.lang))||v.find(x=>/^es/i.test(x.lang))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){if(!S.prefs.voice||!t||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
  u.lang=VOICE?VOICE.lang:'es-AR';if(VOICE)u.voice=VOICE;u.rate=.88;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}

/* Material visual */
const NUMW=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez'];
const OBJ=['🍎','🐟','⭐','🍓','🐝','🎈','🍪','🐞'];
const numeral=n=>`<span class="nm">${n}</span>`;
function optsFrom(ans,cands,n,fmt){fmt=fmt||numeral;n=n||3;const set=[ans];
  for(const c of shuffle(cands)){if(set.length>=n)break;if(c!==ans&&c>=0&&!set.includes(c))set.push(c)}
  let g=0;while(set.length<n&&g++<60){const c=Math.max(0,ans+rnd(-3,3));if(!set.includes(c))set.push(c)}
  return shuffle(set).map(v=>({h:fmt(v),ok:v===ans}))}
const numOpts=(ans,n,lo,hi)=>optsFrom(ans,[ans-1,ans+1,ans-2,ans+2].filter(v=>v>=lo&&v<=hi),n);
const PAT={1:[4],2:[2,6],3:[2,4,6],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function diceSVG(n){const cs=PAT[n].map(i=>`<circle cx="${20+(i%3)*30}" cy="${20+Math.floor(i/3)*30}" r="9" fill="var(--c)"/>`).join('');
  return `<svg class="dice" viewBox="0 0 100 100" role="img" aria-label="${n}"><rect x="2" y="2" width="96" height="96" rx="18" fill="var(--surface)" stroke="var(--line)" stroke-width="3"/>${cs}</svg>`}
function scatter(n,r){for(let rr=r;rr>3;rr*=.9){const pts=[];let tries=0;
  while(pts.length<n&&tries<500){tries++;const x=rnd(Math.ceil(rr)+2,Math.floor(100-rr)-2),y=rnd(Math.ceil(rr)+2,Math.floor(100-rr)-2);
    if(pts.every(p=>Math.hypot(p[0]-x,p[1]-y)>rr*2+2))pts.push([x,y])}
  if(pts.length===n)return{pts,r:rr}}
  const pts=[];for(let i=0;i<n;i++)pts.push([10+(i%5)*20,15+Math.floor(i/5)*25]);return{pts,r:7}}

function lineSVG(max,pos,mode){const x0=20,x1=280,X=v=>x0+(x1-x0)*v/max;

  for(let v=0;v<=max;v++){const big=v===0||v===max||(mode==='mid'&&v===max/2);const lab=mode==='all'||big;
    s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${big?38:42}" y2="${big?58:54}" stroke="var(--ink-2)" stroke-width="${big?3:2}"/>`;
    if(lab)s+=`<text x="${X(v)}" y="78" text-anchor="middle" font-size="14" fill="var(--ink)">${v}</text>`}
  if(pos!=null){const x=X(pos);s+=`<circle cx="${x}" cy="20" r="10" fill="var(--c)"/><path d="M${x-6} 26 L${x} 37 L${x+6} 26Z" fill="var(--c)"/>`}
  return s+'</svg>'}

function oddTrial(n,mode){const sh=shuffle(Object.keys(SH)),cl=shuffle([0,1,2,3,4]);const base={s:sh[0],c:cl[0]};
  const od=mode==='big'?{s:sh[1],c:cl[1]}:(Math.random()<.5?{s:base.s,c:cl[1]}:{s:sh[1],c:base.c});const oi=rnd(0,n-1);
  return {prompt:'Tocá el que es diferente',say:'Tocá el que es diferente.',cols:n>4?3:n,
    opts:[...Array(n)].map((_,i)=>{const f=i===oi?od:base;return {h:shape(f.s,f.c),ok:i===oi}})}}
function cancelTrial(rows,cols,t,mode,tol){const N=rows*cols,ts=pick(Object.keys(SH)),tc=rnd(0,4);
  const os=Object.keys(SH).filter(x=>x!==ts),oc=[0,1,2,3,4].filter(x=>x!==tc);const items=[];
  for(let i=0;i<N;i++){if(i<t){items.push({s:ts,c:tc,k:1});continue}
    if(mode==='shape')items.push({s:pick(os),c:tc,k:0});
    else if(mode==='both')items.push({s:pick(os),c:pick(oc),k:0});
    else items.push(i%2?{s:ts,c:pick(oc),k:0}:{s:pick(os),c:tc,k:0})}
  const cells=shuffle(items);
  return {prompt:'Buscá todas las iguales a esta',say:'Buscá y tocá todas las figuras iguales a esta.',opts:[],
    mount(ctx){ctx.vis.style.display='block';
      ctx.vis.innerHTML=`<div class="sample">${shape(ts,tc)}</div><div class="cgrid" style="--cols:${cols}">${cells.map((it,i)=>`<button type="button" class="cell" data-t data-k="${it.k}" aria-label="figura ${i+1}">${shape(it.s,it.c)}</button>`).join('')}</div>`;
      let found=0,err=0;
      $('.cgrid',ctx.vis).onclick=e=>{const b=e.target.closest('.cell');if(!b||b.classList.contains('found')||ctx.locked())return;
        if(b.dataset.k==='1'){b.classList.add('found');b.disabled=true;found++;SND.tap();ctx.fb(`${found} de ${t}`,'ok');if(found===t)ctx.finish(err<=tol)}
        else{err++;b.classList.add('shake');ctx.later(()=>b.classList.remove('shake'),500);SND.soft();ctx.fb('Esa no. Mirá bien la figura de arriba.','soft');
          if(err>=3){const u=$('.cell[data-k="1"]:not(.found)',ctx.vis);if(u)u.classList.add('hint')}}}}}}

function streamTrial(cfg){
  return {prompt:cfg.prompt,say:cfg.say,opts:[],mount(ctx){
    ctx.vis.style.display='block';
    ctx.vis.innerHTML=`<div class="stim" id="stim" aria-live="off"></div><div class="stack"><button type="button" class="btn alt" id="bGo" data-t>Empezar</button><button type="button" class="btn tapbtn" id="bTap" data-t hidden>¡Toco!</button></div>`;
    const stim=$('#stim',ctx.vis),bGo=$('#bGo',ctx.vis),bTap=$('#bTap',ctx.vis);
    const ng=Math.max(2,Math.round(cfg.n*cfg.pGo));const seq=shuffle([...Array(ng).fill(true),...Array(cfg.n-ng).fill(false)]);
    let i=-1,cur=null,hits=0,fa=0,miss=0,run=false;
    function next(){if(cur&&cur.go&&!cur.resp)miss++;i++;if(i>=cfg.n){end();return}
      const go=seq[i];cur={go,resp:false};stim.className='stim on';stim.textContent=go?pick(cfg.goSet):pick(cfg.noSet);
      ctx.later(()=>{stim.className='stim';stim.textContent='';ctx.later(next,300)},cfg.ms-300)}
    function tap(){if(!run||!cur||cur.resp)return;cur.resp=true;
      if(cur.go){hits++;stim.classList.add('hit');SND.ok()}else{fa++;stim.classList.add('miss');SND.soft()}}
    function end(){run=false;bTap.hidden=true;ctx.setKey(null);const errs=fa+miss;
      ctx.fb(`Tocaste bien ${hits} de ${ng}.`,errs<=cfg.tol?'ok':'soft');ctx.finish(errs<=cfg.tol)}
    bGo.onclick=()=>{bGo.hidden=true;bTap.hidden=false;run=true;ctx.setKey(tap);ctx.fb('','');next()};
    bTap.onclick=tap}}}

const SC={t:null,i:-1,cur:null};

   <div class="fb" id="fb" role="status" aria-live="polite"></div></div>`;

   <div class="panel"><h2>Datos</h2><div class="stack"><button class="btn alt" id="bAv" type="button" data-t>Cambiar mi amigo</button><button class="btn alt" id="bReset" type="button" data-t>Borrar mi progreso</button></div></div>`;

  $$('[data-sw]').forEach(b=>b.onclick=()=>{const id=b.dataset.sw;S.prefs[id]=!S.prefs[id];save();applyPrefs();b.setAttribute('aria-checked',S.prefs[id]);if(id==='voice'&&S.prefs.voice)say('Voz activada');scanStart()});
  $$('[data-ms]').forEach(b=>b.onclick=()=>{S.prefs.scanMs=+b.dataset.ms;save();$$('[data-ms]').forEach(x=>x.setAttribute('aria-pressed',x===b));scanStart()});
  $('#bTest').onclick=()=>say('Hola. Tocá la imagen que escuchás.');
  $('#bAv').onclick=welcome;
  $('#bReset').onclick=()=>{$('#bReset').outerHTML='<div class="panel center"><p>¿Borrar todo el progreso?</p><div class="stack"><button class="btn" id="bYes" type="button" data-t>Sí, borrar</button><button class="btn alt" id="bNo" type="button" data-t>No</button></div></div>';
    $('#bYes').onclick=()=>{const a=S.avatar,pr=S.prefs;S=defaults();S.avatar=a;S.prefs=pr;save();home()};$('#bNo').onclick=settings;scanStart()};
  scanStart()}
applyPrefs();S.avatar?home():welcome();
})();
</script></body></html>
