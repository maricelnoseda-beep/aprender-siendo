# Integración continua: arma la app, verifica sintaxis y corre la prueba de punta a punta.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Armar
        run: python3 app/build.py
      - name: Armar también la versión de un solo archivo (paquete de revisión)
        run: python3 app/build.py --un-archivo
      - name: Verificar sintaxis de cada módulo
        run: for f in $(find app/dist -name '*.js'); do node --check "$f" || exit 1; done
      - name: Reglas deterministas (casos de prueba de la sección 8)
        run: node tests/rules.test.js
      - name: Explorapalabras (generador en las 15 temáticas × 4 Estaciones × 3 grados y ficha de Estaciones)
        run: node tests/explorapalabras.test.js && python3 app/build.py --explorapalabras
      - name: Aventura de Luci (FEC-013) · sección 0 (originalidad) y ficha por grado (REQ-CLI-LUC-02)
        run: python3 scripts/originalidad.py && node tests/luci.test.js && python3 app/build.py --luci
      - name: Instalar navegador de prueba
        run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Prueba de punta a punta
        run: |
          (cd app/dist && python3 -m http.server 8765 &) && sleep 1
          node tests/e2e.js
      - name: Aventura de Luci de punta a punta (archivo suelto)
        run: node tests/luci.e2e.js
      - name: Huella del artefacto (manifiesto con la huella de cada archivo y módulo)
        run: sha256sum app/dist/manifiesto.json
      - uses: actions/upload-artifact@v4
        with: { name: aprender-siendo-dist, path: "app/dist/\napp/dist-un-archivo/\napp/dist-explorapalabras/\napp/dist-luci/" }
